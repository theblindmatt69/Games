/* ============================== TOASTS ============================== */
function toast(text, kind, ms) {
  const box = $('toasts');
  const d = document.createElement('div');
  d.className = 'toast ' + (kind || '');
  d.textContent = text;
  box.appendChild(d);
  while (box.querySelectorAll('.toast:not(.reqt)').length > 4) box.querySelector('.toast:not(.reqt)').remove();
  setTimeout(() => { d.classList.add('out'); setTimeout(() => d.remove(), 320); }, ms || 3200);
  if (kind === 'err') SFX.play('err');
}
function renderRequests() {
  const box = $('toasts');
  const reqs = (A.role === 'host' && A.v && A.v.req) || [];
  const keep = new Set(reqs.map(r => 'req' + r.id));
  box.querySelectorAll('.reqt').forEach(el => { if (!keep.has(el.id)) el.remove(); });
  for (const r of reqs) {
    if ($('req' + r.id)) continue;
    const d = document.createElement('div');
    d.className = 'toast req reqt'; d.id = 'req' + r.id;
    d.innerHTML = `<span class="avatar" style="--av:28px;--c:${esc(r.color)}">${markSVG(r.avatar)}</span><span>${r.why === 'kicked' ? `<b>${esc(r.name)}</b> (removed earlier) wants to join back` : `<b>${esc(r.name)}</b> wants their seat back`}</span><span class="tb"><button class="btn small gold" data-act="accept" data-id="${r.id}">Let in</button><button class="btn small" data-act="deny" data-id="${r.id}">No</button></span>`;
    box.prepend(d);
    SFX.play('join');
  }
}

/* ============================== HELPERS ============================== */
function setHTML(el, html) { if (el && el._h !== html) { el._h = html; el.innerHTML = html; } }
const game = () => (A.v && A.v.game) || null;
const seatName = i => { const g = game(); return g && g.seats[i] ? g.seats[i].name : '?'; };
const isHost = () => A.role === 'host';
const seatCol = (g, i) => (g && g.seats[i] ? COLS[g.seats[i].col % COLS.length].c : '#8a95ab');
function avatarHTML(av, color, size) { return `<span class="avatar" style="${size ? `--av:${size}px;` : ''}--c:${esc(color)}">${markSVG(av)}</span>`; }
function toHost(m) {
  if (A.role === 'host') return Room.cmd.fromSelf(m);
  if (A.reconnecting || !Net.via()) {
    if (m.t === 'chat' || m.t === 'profile') { (A.outbox = A.outbox || []).push(m); if (A.outbox.length > 20) A.outbox.shift(); toast("Reconnecting… it'll send when you're back."); }
    else toast('Reconnecting… try that again in a moment.', 'err');
    return;
  }
  Net.sendHost(m);
}
function flushOutbox() { const q = A.outbox || []; A.outbox = []; for (const m of q) Net.sendHost(m); }
function act(x) { toHost({ t: 'act', x }); }
const hostName = () => { const h = A.v && A.v.members.find(m => m.host); return h ? h.name : ''; };

/* ============================== EFFECTS ============================== */
function center(el) { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
const onGame = () => !$('scr-game').classList.contains('hidden') && !document.hidden;
function pop(el, html) {
  if (!el || !onGame()) return;
  const [x, y] = center(el);
  const d = document.createElement('div');
  d.className = 'pop'; d.style.left = x + 'px'; d.style.top = y + 'px'; d.innerHTML = html;
  $('fx').appendChild(d);
  setTimeout(() => d.remove(), 1350);
}
function flash(color) { if (!onGame()) return; const d = document.createElement('div'); d.className = 'flash'; d.style.background = color; $('fx').appendChild(d); setTimeout(() => d.remove(), 650); }
function shake() { const t = $('table'); t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake'); }
function banner(text, color) { if (!onGame()) return; const d = document.createElement('div'); d.className = 'banner'; d.style.color = color || '#fff'; d.textContent = text; document.body.appendChild(d); setTimeout(() => d.remove(), 1450); }
function confetti() {
  if (document.hidden) return;
  const c = document.createElement('canvas'); c.id = 'confetti';
  c.width = innerWidth; c.height = innerHeight; document.body.appendChild(c);
  const x = c.getContext('2d'), cols = ['#ff4d5a', '#f7c948', '#2ed3b0', '#4da3ff', '#a97bff', '#fff'];
  const P = Array.from({ length: 160 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * 0.5, vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 4, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3, s: 5 + Math.random() * 6, c: pickR(cols) }));
  const t0 = performance.now();
  (function f(t) {
    x.clearRect(0, 0, c.width, c.height);
    for (const p of P) { p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); }
    if (t - t0 < 3800) requestAnimationFrame(f); else c.remove();
  })(t0);
}

/* the game's board and rules (game file) */
const SH = { A, $, esc, act, toHost, toast, SFX, game, isHost, seatCol, seatName, avatarHTML, pop, flash, shake, banner, confetti, setHTML, COLS, cid: () => cid, renderGame: () => renderGame() };
const GU = window.GUI(SH);
window.SH = SH;

/* ============================== SCREENS ============================== */
function show() {
  const inRoom = !!(A.role && A.v && !A.waiting);
  const scr = A.waiting ? 'wait' : !inRoom ? 'home' : A.v.phase === 'lobby' ? 'lobby' : 'game';
  for (const s of ['home', 'wait', 'lobby', 'game']) $('scr-' + s).classList.toggle('hidden', s !== scr);
  $('topbar').classList.toggle('hidden', !inRoom);
  const side = $('side');
  side.classList.toggle('hidden', !inRoom);
  side.classList.toggle('open', A.sideOpen);
  side.classList.toggle('closed', !A.sideOpen);
  if (scr === 'wait') renderWait();
  if (scr === 'home') renderHome();
  if (scr === 'home' && !A.browseStop && Net.browse) { A.browseAt = Date.now(); A.browseStop = Net.browse(list => { A.rooms = list; renderRooms(); }); setTimeout(renderRooms, 4200); }
  if (scr !== 'home' && A.browseStop) { A.browseStop(); A.browseStop = null; }
  return scr;
}
function render() {
  const scr = show();
  if (scr === 'lobby' || scr === 'game') renderTop();
  if (scr === 'lobby') renderLobby();
  if (scr === 'game') renderGame();
  renderModal();
  renderSide();
  renderRequests();
}
function renderTop() {
  const hn = hostName();
  $('tbRoom').textContent = hn ? `${hn}'s room` : 'Room';
  $('tbSound').innerHTML = A.sound ? '<svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M4 9h3.5L12 5v14l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>' : '<svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M4 9h3.5L12 5v14l-4.5-4H4z" fill="currentColor"/><path d="M16 9.5l5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
  const u = $('tbUnread');
  u.textContent = A.unread; u.classList.toggle('hidden', !A.unread || (A.sideOpen && A.tab === 'chat'));
  const n = $('tbNet'), t = $('tbNetTxt');
  n.classList.remove('warn', 'bad');
  if (isHost()) {
    const st = (A.v && A.v.routes) || A.routes || {};
    const on = ROUTES.filter(r => st[r[0]] === 'on').length;
    t.textContent = on + ' route' + (on === 1 ? '' : 's');
    if (on < 3) n.classList.add('warn');
    if (on === 0) n.classList.add('bad');
  } else if (A.reconnecting) { t.textContent = 'Reconnecting…'; n.classList.add('warn'); }
  else t.textContent = (Net.VIA_LABEL[A.via] || 'Online').split(' (')[0];
  let rb = document.querySelector('.rebanner');
  if (A.reconnecting && !rb) { rb = document.createElement('div'); rb.className = 'rebanner'; rb.textContent = 'Connection lost. Reconnecting (trying every route)…'; document.body.appendChild(rb); }
  if (!A.reconnecting && rb) rb.remove();
}

/* ------------------------------ home ------------------------------ */
function renderHome() {
  const av = $('homeAv');
  av.innerHTML = markSVG(prof.avatar); av.style.setProperty('--c', prof.color);
  if (document.activeElement !== $('nameIn')) $('nameIn').value = prof.name || '';
}
function renderRooms() {
  const el = $('roomsCard');
  if (!el || $('scr-home').classList.contains('hidden')) return;
  const list = A.rooms || [];
  const searching = Date.now() - (A.browseAt || 0) < 4000;
  const rows = list.map(r => {
    const lobby = r.phase === 'lobby', full = r.n >= r.max;
    return `<button class="rrow" data-act="joinroom" data-code="${esc(r.code)}"><span class="avatar" style="--av:40px;--c:#2a3346">${esc(r.av || '')}</span><span class="ri"><b>${esc(r.host)}'s room</b><small>${r.n}/${r.max} players${r.bots ? ` (${r.bots} bot${r.bots > 1 ? 's' : ''})` : ''}${r.specs ? ` · ${r.specs} watching` : ''} · ${lobby ? (full ? 'Full: you can watch' : 'In the lobby') : 'Playing: you can watch'}</small></span><span class="rjoin ${lobby && !full ? '' : 'watch'}">${lobby && !full ? 'Join' : 'Watch'}</span></button>`;
  }).join('');
  const empty = searching ? '<div class="rempty"><div class="spinner small"></div>Looking for open rooms…</div>' : '<div class="rempty">No open rooms right now.<br>Host one and it shows up here for everyone.</div>';
  setHTML(el, `<div class="rc-head"><h3>Open rooms</h3><span class="live"><i></i>${list.length ? list.length + ' live' : 'Live'}</span></div><div class="rlist">${rows || empty}</div><div class="rc-foot">Every room shows up here. Pick one to join, or host your own.</div>`);
}
function note(text, err) { const n = $('homeNote'); n.textContent = text || ''; n.classList.toggle('err', !!err); }
function saveName() {
  const v = $('nameIn').value.replace(/[<>]/g, '').trim().slice(0, 16);
  if (!v) { note('Type your name first.', true); $('nameIn').focus(); return false; }
  prof.name = v; store.set('dd_prof', prof);
  return true;
}
function renderWait() {
  const w = A.waiting || {};
  let steps = '';
  if (w.steps) steps = '<div class="route-steps">' + w.steps.map(s => `<div class="${s.st}">${esc(s.label)}</div>`).join('') + '</div>';
  setHTML($('waitCard'), `${w.spin === false ? '' : '<div class="spinner"></div>'}<h2>${esc(w.title || '')}</h2><p>${esc(w.text || '')}</p>${steps}<div class="mbtns row">${(w.btns || [['Cancel', 'cancelwait']]).map(b => `<button class="btn" data-act="${b[1]}">${esc(b[0])}</button>`).join('')}</div>`);
}

/* ------------------------------ lobby ------------------------------ */
function prow(m, host) {
  const me = m.cid === cid;
  const tags = (m.host ? '<span class="tagp host">HOST</span>' : '') + (me ? '<span class="tagp you">YOU</span>' : '') + (m.bot ? '<span class="tagp bot">BOT</span>' : '');
  const sub = m.bot ? 'Computer player' : !m.conn ? 'Reconnecting…' : m.host ? 'Running the game' : (Net.VIA_LABEL[m.via] || 'Connected');
  const rec = m.games ? ` · ${m.wins}/${m.games}` : '';
  const x = host && !m.host ? `<button class="x-btn" data-act="kick" data-cid="${esc(m.cid)}" title="${m.bot ? 'Remove bot' : 'Remove player'}">✕</button>` : '';
  return `<div class="prow" data-act="player" data-cid="${esc(m.cid)}">${avatarHTML(m.avatar, m.color)}<div class="who"><div class="nm">${esc(m.name)}${tags}</div><div class="sub">${sub}${rec}</div></div>${x}</div>`;
}
const LH = {
  seg: (k, cur, opts) => `<div class="seg">${opts.map(o => `<button class="${String(o[0]) === String(cur) ? 'on' : ''}" data-act="set" data-k="${k}" data-v="${o[0]}">${o[1]}</button>`).join('')}</div>`,
  tog: (k, on, label) => `<button class="tog ${on ? 'on' : ''}" data-act="setb" data-k="${k}" aria-label="${esc(label || k)}"></button>`,
  sel: (k, cur, opts) => `<select class="sel" data-set="${k}">${opts.map(o => `<option value="${o[0]}" ${String(o[0]) === String(cur) ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>`,
  row: (label, small, ctl) => `<div class="srow"><div class="sl">${label}${small ? `<small>${small}</small>` : ''}</div>${ctl}</div>`,
};
function renderLobby() {
  const v = A.v, host = isHost(), S = v.settings, MAX = GE.MAX_SEATS;
  const ps = v.members.filter(m => !m.spec), specs = v.members.filter(m => m.spec);
  let rows = ps.map(m => prow(m, host)).join('');
  if (ps.length < MAX) rows += `<div class="empty-slot">${host ? 'Empty seat: wait for someone from Open rooms or add a bot' : 'Waiting for more players…'}</div>`;
  const specHTML = specs.length ? `<h3 style="margin-top:14px">Watching <span>${specs.length}</span></h3><div class="plist">${specs.map(m => prow(m, host)).join('')}</div>` : '';
  const st = v.routes || {};
  const routes = host
    ? `<div class="routes"><b>Ways in for your friends</b>${ROUTES.map(r => `<span class="rchip ${st[r[0]] || 'off'}">${r[1]} ${st[r[0]] === 'on' ? '✓' : st[r[0]] === 'fail' ? '✕' : st[r[0]] === 'retry' ? '…' : '–'}</span>`).join('')}</div>`
    : `<div class="routes"><b>Your connection</b><span class="rchip on">${esc(Net.VIA_LABEL[A.via] || 'Connected')} ✓</span></div>`;
  const n = ps.length;
  const tt = GU.timerOpts || [0, 15, 30, 45, 60, 90];
  const setup = `<div class="panel setup ${host ? '' : 'locked'}">
    <h3>Game setup <span>${host ? 'you choose' : 'host chooses'}</span></h3>
    ${GU.settings ? GU.settings(S, n, LH) : ''}
    ${LH.row(GU.timerLabel || 'Turn timer', GU.timerSmall || 'Out of time? A move is made for you', LH.sel('turnTime', S.turnTime, tt.map(x => [x, x ? x + ' s' : 'Off'])))}
    ${LH.row('Bot skill', '', LH.seg('botLevel', S.botLevel, [['easy', 'Easy'], ['normal', 'Normal'], ['hard', 'Hard']]))}
    ${LH.row('Bot chat', 'Jokes, taunts and the odd lie', LH.seg('botChat', S.botChat || 'some', [['off', 'Off'], ['some', 'Some'], ['lots', 'Lots']]))}
    <div class="soon">${esc(GU.lobbyNote ? GU.lobbyNote(n) : '')}</div>
  </div>`;
  const me = v.members.find(m => m.cid === cid);
  const foot = host
    ? `<button class="btn primary big" data-act="start" ${ps.length < 2 ? 'disabled' : ''}>▶ Start game</button><span class="note">${ps.length < 2 ? 'You need at least 2 players. Add a bot to test!' : `${ps.length} players ready`}</span>`
    : `<span class="note">${me && me.spec ? 'The room is full. You\'re watching.' : 'Waiting for the host to start…'}</span><button class="btn small" data-act="leave">Leave room</button>`;
  setHTML($('scr-lobby'), `<div class="lobby">
    <div class="lobby-head"><div class="code-big listed"><span class="lic"></span><div><b>${esc(hostName())}'s room</b><small>Listed in Open rooms on the ${esc(GU.title)} home page</small></div></div>${routes}</div>
    <div class="lobby-grid">
      <div class="panel"><h3>Players <span>${ps.length}/${MAX}</span></h3><div class="plist">${rows}</div>
        ${host ? `<div class="row-btns"><button class="btn small" data-act="addbot" ${ps.length >= MAX ? 'disabled' : ''}>Add bot</button><button class="btn small ghost" data-act="rules">Rules</button></div>` : `<div class="row-btns"><button class="btn small ghost" data-act="rules">Rules</button></div>`}${specHTML}</div>
      ${setup}
    </div>
    <div class="lobby-foot">${foot}</div>
  </div>`);
}

/* ------------------------------ game ------------------------------ */
function renderGame() {
  const g = game();
  if (!g) return;
  renderPlayers(g); renderTabs(g);
  try { GU.render(g); } catch (e) { console.error(e); }
  renderBar(g); renderEnd(g);
}
function renderPlayers(g) {
  const html = g.T.players.map(i => {
    const s = g.seats[i];
    const cur = (i === g.T.cur || g.T.need.indexOf(i) >= 0) && g.phase !== 'over' && s.alive && !g.T.done;
    const col = seatCol(g, i);
    const st = !s.alive ? '' : (!s.conn && !s.bot ? '' : '');
    const ring = cur && g.T.turnTotal > 0 && !s.bot && g.mode === 'turn' ? `<svg class="ring" viewBox="0 0 68 68"><circle class="bg" cx="34" cy="34" r="31"/><circle class="fg" data-timer="ring" cx="34" cy="34" r="31" stroke-dasharray="194.8" stroke-dashoffset="0"/></svg>` : '';
    const sub = GU.chip ? GU.chip(g, i) : '';
    const done = g.mode === 'simul' && g.phase !== 'over' && !g.T.done && s.alive && g.T.need.indexOf(i) < 0 ? '<span title="Ready"></span>' : '';
    return `<div class="pchip ${cur ? 'cur' : ''} ${s.alive ? '' : 'out'} ${i === g.me ? 'me' : ''}" id="seat-${i}" data-act="seat" data-i="${i}" style="--pc:${col}"><div class="avwrap">${avatarHTML(s.avatar, col)}${ring}${st ? `<span class="st">${st}</span>` : ''}</div><div class="pinfo"><div class="pn">${esc(s.name)}</div><div class="ps">${sub}${done}</div></div></div>`;
  }).join('');
  setHTML($('players'), html);
}
function tableLabel(g, X) {
  const nm = X.players.map(i => esc(g.seats[i].name.replace(/^Bot /, ''))).join(' vs ');
  return nm;
}
function renderTabs(g) {
  if (g.ntab < 2) { setHTML($('tabs'), ''); return; }
  const mine = g.me >= 0 ? g.seats[g.me].t : -1;
  const canSwitch = mine < 0 || (g.tables[mine] && g.tables[mine].done) || g.phase === 'over';
  setHTML($('tabs'), g.tables.map(X => `<button class="tab ${X.tb === g.tb ? 'on' : ''} ${X.done ? 'done' : ''}" ${canSwitch || X.tb === mine ? `data-act="watch" data-tb="${X.tb}"` : 'disabled'} title="${X.done ? 'Finished' : 'Playing'}"><span class="dot"></span>Table ${X.tb + 1}: ${tableLabel(g, X)}${X.tb === mine ? ' (you)' : ''}</button>`).join(''));
}
function renderBar(g) {
  const me = g.me, mine = me >= 0 ? g.seats[me] : null;
  const T = g.T;
  let s1 = '', s2 = '', btns = '';
  const curName = T.cur >= 0 ? esc(seatName(T.cur)) : '';
  const others = g.tables.filter(X => !X.done && X.tb !== (mine ? mine.t : -1)).length;
  if (g.phase === 'over') {
    s1 = g.ended ? 'Game ended' : g.winners.length === 1 ? `${esc(seatName(g.winners[0]))} wins!` : g.winners.length ? '' + g.winners.map(i => esc(seatName(i))).join(' & ') + ' win their tables!' : "It's a draw";
    s2 = isHost() ? 'Start another round from the end screen.' : 'Waiting for the host…';
  } else if (mine && mine.why === 'sitout') { s1 = 'Sitting this one out'; s2 = 'You play next game.'; }
  else if (mine && mine.t === g.tb && T.done) {
    const won = T.result && T.result.winners.indexOf(me) >= 0;
    s1 = won ? 'You won your table!' : T.result && T.result.draw ? 'Your table is a draw' : 'Your game is over';
    s2 = others ? `Waiting for ${others === 1 ? 'the other table' : 'the other tables'} to finish. You can watch them above.` : 'Waiting for the results…';
  }
  else if (me < 0 || (mine && mine.t !== g.tb)) { s1 = `You're watching${g.ntab > 1 ? ' table ' + (g.tb + 1) : ''}`; s2 = T.done ? 'This table is finished.' : g.mode === 'turn' ? `${curName}'s turn` : 'Everyone is making their move…'; }
  else if (!mine.alive) { s1 = "You're out of this game"; s2 = g.mode === 'turn' ? `${curName}'s turn` : ''; }
  else if (g.canAct) { const b = GU.bar(g) || {}; s1 = b.s1 || 'Your turn'; s2 = b.s2 || ''; btns = b.btns || ''; }
  else if (g.mode === 'turn') { const c = g.seats[T.cur]; s1 = `${curName}'s turn`; s2 = c && c.bot ? 'The bot is thinking…' : (GU.waitText ? GU.waitText(g) : 'Thinking…'); if (GU.idleBtns) btns = GU.idleBtns(g); }
  else { s1 = 'Locked in'; s2 = 'Waiting for ' + T.need.map(i => esc(seatName(i))).join(', ') + '…'; if (GU.idleBtns) btns = GU.idleBtns(g); }
  const curSeat = T.cur >= 0 ? g.seats[T.cur] : null;
  const running = g.phase !== 'over' && !T.done && T.turnTotal > 0 && (g.mode === 'simul' ? T.need.some(i => !g.seats[i].bot) : curSeat && !curSeat.bot);
  const timer = running ? `<div class="tbar"><i data-timer="turn"></i></div>` : '';
  setHTML($('bar'), `<div class="status ${g.canAct ? 'mine' : ''}"><div class="s1">${s1}</div><div class="s2">${s2}</div>${timer}</div>${btns}`);
}
function renderEnd(g) {
  const w = $('endwrap');
  if (g.phase !== 'over' || A.endHidden) { setHTML(w, A.endHidden && g.phase === 'over' ? `<div style="position:absolute;top:10px;right:10px;z-index:21"><button class="btn small gold" data-act="showend">Results</button></div>` : ''); return; }
  const btns = isHost()
    ? `<div class="mbtns row"><button class="btn primary" data-act="again">Play again</button><button class="btn" data-act="tolobby">Back to lobby</button></div>`
    : `<p style="margin:0 0 10px">Waiting for the host to start the next game…</p><div class="mbtns row"><button class="btn" data-act="leave">Leave room</button></div>`;
  let title, sub, body, trophy;
  if (g.ended) { trophy = TROPHY.stop; title = 'Game ended'; sub = 'The host ended the game.'; body = ''; }
  else if (g.ntab > 1) {
    const iWon = g.winners.indexOf(g.me) >= 0;
    trophy = iWon ? TROPHY.win : TROPHY.flag; title = iWon ? 'You won your table!' : 'Results';
    sub = 'Each table plays its own match.';
    body = `<div class="tblres">${g.tables.map(X => {
      const r = X.result || { winners: [], draw: true };
      const pl = X.players.map(i => `<span class="${r.winners.indexOf(i) >= 0 ? 'w' : ''}">${avatarHTML(g.seats[i].avatar, seatCol(g, i), 26)} ${esc(g.seats[i].name)}</span>`).join('<span style="color:var(--muted)">vs</span>');
      return `<div class="tr"><h4>Table ${X.tb + 1} · ${r.draw ? 'draw' : esc(g.seats[r.winners[0]].name) + ' wins'}${GU.tableScore ? ' · ' + GU.tableScore(g, X) : ''}</h4><div class="vs">${pl}</div>${r.text ? `<div class="side-note">${esc(r.text)}</div>` : ''}</div>`;
    }).join('')}</div>`;
  } else {
    const win = g.winners.length === 1 ? g.seats[g.winners[0]] : null;
    trophy = win ? TROPHY.win : TROPHY.draw; title = win ? esc(win.name) + ' wins!' : "It's a draw!";
    const r = g.T.result;
    sub = (r && r.text) ? r.text : (GU.endSub ? GU.endSub(g) : '');
    const places = g.T.players.map(i => Object.assign({ i }, g.seats[i])).sort((a, b) => (a.place || 99) - (b.place || 99));
    body = `<div class="places">${places.map(s => `<div class="place ${s.place === 1 ? 'first' : ''}"><span class="pn">${s.place ? '#' + s.place : '–'}</span>${avatarHTML(s.avatar, seatCol(g, s.i))}<b style="flex:1">${esc(s.name)}</b><span style="text-align:right">${GU.endRow ? GU.endRow(g, s.i) : ''}${s.alive ? '' : '<br><small style="color:var(--muted)">left</small>'}</span></div>`).join('')}</div>`;
  }
  setHTML(w, `<div class="endcard"><div class="endbox"><div class="trophy">${trophy}</div><h2>${title}</h2><p style="color:var(--muted);margin:0">${esc(sub)}</p>${body}${btns}<button class="btn ghost small" style="margin-top:8px" data-act="viewtable">View the board</button></div></div>`);
}

/* ============================== MODALS ============================== */
function renderModal() {
  const m = $('modal');
  const html = A.modal ? modalHTML(A.modal, game()) : '';
  if (!html) { m.classList.add('hidden'); setHTML(m, ''); return; }
  m.classList.remove('hidden');
  setHTML(m, html);
}
function modalHTML(md, g) {
  const v = A.v;
  switch (md.type) {
    case 'player': {
      const m = v && v.members.find(x => x.cid === md.cid);
      let s = null, si = -1;
      if (g) { si = g.seats.findIndex(x => x.cid === md.cid); if (si >= 0) s = g.seats[si]; }
      if (!m && !s) { A.modal = null; return ''; }
      const P = m || s, me = md.cid === cid;
      const rows = [];
      rows.push(['Status', m ? (m.bot ? 'Bot' : !m.conn ? 'Reconnecting' : m.host ? 'Host' : m.spec ? 'Watching' : 'Connected') : 'Left the room']);
      if (m && !m.bot && !m.host) rows.push(['Route', esc(Net.VIA_LABEL[m.via] || '–')]);
      if (s && s.why !== 'sitout') rows.push(['This game', `${esc(COLS[s.col % COLS.length].n)}${g.ntab > 1 ? ' · table ' + (s.t + 1) : ''}${s.alive ? '' : ' · left the game'}`]);
      if (m) rows.push(['Record', `${m.wins} win${m.wins === 1 ? '' : 's'} in ${m.games} game${m.games === 1 ? '' : 's'}`]);
      const btns = [];
      if (me) btns.push('<button class="btn" data-act="profile">Edit name & avatar</button>');
      if (isHost() && m && !m.host) btns.push(`<button class="btn" data-act="kick" data-cid="${esc(m.cid)}">${m.bot ? 'Remove bot' : 'Remove from room'}</button>`);
      btns.push('<button class="btn ghost" data-act="mclose">Close</button>');
      return `<div class="mbox pcard">${avatarHTML(P.avatar, s && s.why !== 'sitout' ? seatCol(g, si) : P.color, 84)}<h2>${esc(P.name)}</h2><div>${m && m.host ? '<span class="tagp host">HOST</span>' : ''}${me ? '<span class="tagp you">YOU</span>' : ''}${P.bot ? '<span class="tagp bot">BOT</span>' : ''}</div><div class="kv">${rows.map(r => `<span>${r[0]}</span><span>${r[1]}</span>`).join('')}</div><div class="mbtns">${btns.join('')}</div></div>`;
    }
    case 'menu': {
      const inGame = v && v.phase === 'game', playing = inGame && g && g.phase !== 'over';
      const b = [];
      if (isHost()) {
        if (playing) b.push('<button class="btn" data-act="endgame">End game</button>');
        if (inGame) b.push('<button class="btn" data-act="tolobby">Back to lobby</button>');
      }
      b.push('<button class="btn" data-act="rules">How to play</button>');
      b.push('<button class="btn" data-act="profile">Edit name & avatar</button>');
      b.push(`<button class="btn" data-act="sound">${A.sound ? 'Mute sounds' : 'Turn sounds on'}</button>`);
      b.push(isHost() ? '<button class="btn" data-act="closeroom" style="color:#ff8a93">✕ Close the room</button>' : '<button class="btn" data-act="leave" style="color:#ff8a93">Leave room</button>');
      b.push('<button class="btn ghost" data-act="mclose">Back to the game</button>');
      return `<div class="mbox"><h2>${isHost() ? 'Host menu' : '☰ Menu'}</h2><p>${esc(hostName())}'s room · listed in Open rooms</p><div class="mbtns">${b.join('')}</div>${BuildVer.html()}</div>`;
    }
    case 'routes': {
      const st = (v && v.routes) || {};
      const info = { local: 'Other tabs in this browser', peer: 'Direct peer-to-peer link (fastest)', nostr: 'Peer-to-peer, found through Nostr servers', torrent: 'Peer-to-peer, found through torrent trackers', relay: 'Encrypted messages through public relays on the normal web port. Works when direct links are blocked.' };
      const rows = isHost()
        ? ROUTES.map(r => `<div><b>${r[1]}</b><span style="flex:1">${info[r[0]]}</span><span class="k">${st[r[0]] === 'on' ? 'listening' : st[r[0]] === 'fail' ? 'unavailable' : st[r[0]] === 'retry' ? 'retrying' : '–'}</span></div>`).join('')
        : `<div><b>${esc(Net.VIA_LABEL[A.via] || 'Unknown')}</b><span>You're connected this way. If it drops, the game tries every route again automatically.</span></div>`;
      return `<div class="mbox"><h2>Connection routes</h2><p>${isHost() ? 'Your room listens on all of these at once. Friends use whichever gets through first.' : ''}</p><div class="rtable">${rows}</div><div class="mbtns" style="margin-top:14px"><button class="btn ghost" data-act="mclose">Close</button></div></div>`;
    }
    case 'profile': {
      const p = A.pick || (A.pick = { name: prof.name, avatar: prof.avatar, color: prof.color });
      return `<div class="mbox"><h2>Your look</h2><div class="profile-row" style="margin:10px 0">${avatarHTML(p.avatar, p.color, 58)}<input class="field" id="profName" maxlength="16" value="${esc(p.name)}" placeholder="Your name"></div><div class="picker">${AVATARS.map(a => `<button class="${a === p.avatar ? 'on' : ''}" data-act="pickav" data-v="${a}">${markSVG(a)}</button>`).join('')}</div><div class="swatches" style="margin:12px 0">${COLORS.map(c => `<button class="${c === p.color ? 'on' : ''}" style="background:${c}" data-act="pickcol" data-v="${c}"></button>`).join('')}</div><p style="margin:0 0 10px">In a game, your pieces use your seat color.</p><div class="mbtns row"><button class="btn primary" data-act="saveprof">Save</button><button class="btn ghost" data-act="mclose">Cancel</button></div></div>`;
    }
    case 'confirm':
      return `<div class="mbox"><h2>${esc(md.title)}</h2><p>${esc(md.text)}</p><div class="mbtns row"><button class="btn primary" data-act="confirmok">${esc(md.ok || 'OK')}</button><button class="btn ghost" data-act="mclose">Cancel</button></div></div>`;
    case 'rules':
      return `<div class="mbox wide rules"><h2>How to play ${esc(GU.title)}</h2>${GU.rules}<div class="mbtns" style="margin-top:14px"><button class="btn primary" data-act="mclose">Let's play</button></div></div>`;
  }
  return '';
}
function openModal(m) { A.modal = m; renderModal(); }
function closeModal() { A.modal = null; A.pick = null; renderModal(); }
function confirmBox(title, text, ok, fn) { A.confirmFn = fn; openModal({ type: 'confirm', title, text, ok }); }

/* ============================== SIDE PANEL ============================== */
function renderSide() {
  if (!A.role) return;
  document.querySelectorAll('.side-tabs [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === A.tab));
  $('chatList').classList.toggle('hidden', A.tab !== 'chat');
  $('logList').classList.toggle('hidden', A.tab !== 'log');
  $('chatForm').classList.toggle('hidden', A.tab !== 'chat');
  const cl = $('chatList');
  const atBottom = cl.scrollHeight - cl.scrollTop - cl.clientHeight < 40;
  setHTML(cl, A.chat.map(m => m.sys ? `<div class="msg sys">${esc(m.text)}</div>` : `<div class="msg">${avatarHTML(m.avatar, m.color, 26)}<div class="mt"><div class="mn" style="color:${esc(m.color)}">${esc(m.name)}</div>${esc(m.text)}</div></div>`).join('') || '<div class="msg sys">Say hi</div>');
  if (atBottom) cl.scrollTop = cl.scrollHeight;
  const g = game(), ll = $('logList');
  const lb = ll.scrollHeight - ll.scrollTop - ll.clientHeight < 40;
  setHTML(ll, g ? g.log.map(l => `<div class="logl ${l.cls}">${esc(l.txt)}</div>`).join('') : '<div class="msg sys">The game log shows up here once a game starts.</div>');
  if (lb) ll.scrollTop = ll.scrollHeight;
  if (A.sideOpen && A.tab === 'chat') A.unread = 0;
}

/* ============================== EVENTS FROM THE GAME ============================== */
function onFx(e) {
  const g = game();
  const mineTb = g && g.me >= 0 ? g.seats[g.me].t : -1;
  const here = !g || e.tb == null || e.tb === g.tb;
  switch (e.kind) {
    case 'yourturn': SFX.play('turn'); { const st = document.querySelector('#bar .status'); if (st) { st.classList.remove('flashy'); void st.offsetWidth; st.classList.add('flashy'); } } return;
    case 'win':
      if (e.tb === mineTb || mineTb < 0 && here) setTimeout(() => { if (g && e.who === g.me) { SFX.play('win'); confetti(); } else if (mineTb === e.tb) SFX.play('lose'); else SFX.play('win'); }, 450);
      return;
    case 'draw': if (here) SFX.play('draw'); return;
    case 'out': if (here) SFX.play('out'); return;
  }
  if (here && GU.onFx) { try { GU.onFx(e, g); } catch (er) { /* effects must never break the game */ } }
}
function onEv(e) { if (e && e.t === 'fx') onFx(e); }

/* ============================== TIMERS (every frame) ============================== */
function frame() {
  requestAnimationFrame(frame);
  const g = game();
  if (!g || !A.v || A.v.phase !== 'game') return;
  const el = performance.now() - A.vAt;
  const T = g.T;
  const cur = T.cur >= 0 ? g.seats[T.cur] : null;
  const running = g.phase !== 'over' && !T.done && (g.mode === 'simul' || (cur && !cur.bot));
  const tl = Math.max(0, T.turnRemain - (running ? el : 0));
  const tf = T.turnTotal > 0 ? tl / T.turnTotal : 1;
  document.querySelectorAll('[data-timer="turn"]').forEach(i => { i.style.width = (tf * 100).toFixed(1) + '%'; i.parentNode.classList.toggle('low', tl < 10000); });
  document.querySelectorAll('[data-timer="ring"]').forEach(c => { c.setAttribute('stroke-dashoffset', (194.8 * (1 - tf)).toFixed(1)); c.style.stroke = tl < 10000 ? '#ff4d5a' : ''; });
  if (running && g.canAct && T.turnTotal > 0 && tl < 5000 && tl > 0) {
    const s = Math.ceil(tl / 1000);
    if (s !== A.lastTick) { A.lastTick = s; SFX.play('tick'); }
  } else A.lastTick = -1;
  if (GU.frame) GU.frame(g);
}

/* ============================== NETWORK EVENTS ============================== */
function clientRecv(m) {
  if (!m || typeof m !== 'object') return;
  switch (m.t) {
    case 'welcome':
      A.code = m.code; A.chat = m.chat || []; A.waiting = null; A.reconnecting = false;
      break;
    case 'state': {
      const first = !A.v;
      A.v = m; A.vAt = performance.now(); A.code = m.code || A.code;
      if (m.gameNo !== A.lastGameNo && m.phase === 'game') { A.lastGameNo = m.gameNo; A.endHidden = false; A.watch = null; if (GU.reset) GU.reset(); }
      if (m.phase === 'lobby') { A.endHidden = false; }
      if (first) A.waiting = null;
      render();
      return;
    }
    case 'chat':
      A.chat.push(m.m); if (A.chat.length > 100) A.chat.shift();
      const bub = m.m.bot && A.v && window.Says ? Says.show(m.m) : false;   // bots talk in speech bubbles
      if (!(A.sideOpen && A.tab === 'chat') && !m.m.sys && !bub) { A.unread++; SFX.play('chat'); }
      renderSide(); renderTop();
      return;
    case 'ev': onEv(m.e); return;
    case 'toast': toast(m.text, m.kind); return;
    case 'err': toast(m.text, 'err'); return;
    case 'wait':
      A.waiting = { title: m.why === 'kicked' ? 'Asking the host to let you back in…' : 'Asking for your seat back…', text: m.why === 'kicked' ? 'You were removed from this room earlier, so the host has to say yes.' : 'Someone with your name or device left a seat in this game. The host decides.' };
      break;
    case 'denied':
      leaveRoom(true);
      note(m.why === 'full' ? 'That room is full.' : 'The host said no this time.', true);
      return;
    case 'kicked': leaveRoom(true); note('The host removed you from the room.', true); return;
    case 'closed': if (A.role === 'guest') { leaveRoom(true); note('The host closed the room.', true); } return;
    case 'replaced': A.leaving = true; Net.leave(); A.waiting = { title: 'Opened somewhere else', text: 'You joined this room from another tab or window, so this one stepped aside.', spin: false, btns: [['Home', 'home']] }; break;
  }
  render();
}

/* ============================== HOST / JOIN ============================== */
function hostRoom() {
  if (!saveName()) return;
  SFX.unlock();
  A.role = 'host'; A.leaving = false;
  A.waiting = { title: 'Opening your room…', text: 'Setting up every connection route and listing it in Open rooms.', btns: [] };
  show();
  Room.open(prof, { cid, dev }, clientRecv, code => {
    A.code = code; A.waiting = null;
    toast('Your room is open and listed!', 'good');
    render();
  }, st => { A.routes = st; if (A.v) renderTop(); });
}
const STEP_LABELS = { local: 'Same device', peer: 'Direct (PeerJS)', nostr: 'Backup A (Nostr)', torrent: 'Backup B (Torrent trackers)', relay: 'Relay (encrypted, web port)' };
async function joinRoom(code, isRetry, label) {
  code = String(code || '').toUpperCase().replace(/[^A-Z]/g, '');
  if (code.length !== 5) return false;
  if (!isRetry && !saveName()) return false;
  SFX.unlock();
  A.role = 'guest'; A.code = code; A.leaving = false;
  const steps = Object.keys(STEP_LABELS).map(k => ({ k, label: STEP_LABELS[k], st: k === 'local' ? 'on' : '' }));
  if (!isRetry) { A.waiting = { title: `Joining ${label || 'the room'}…`, text: 'Trying every route until one gets through.', steps }; show(); }
  const via = await Net.join(code, { onMsg: clientRecv, onClose: lost }, k => {
    if (!A.waiting || !A.waiting.steps) return;
    for (const s of A.waiting.steps) { if (s.k === 'local') s.st = 'done'; if (s.k === k) s.st = 'on'; }
    renderWait();
  });
  if (A.role !== 'guest' || A.code !== code || A.leaving) { if (via) Net.leave(); return false; }
  if (!via) {
    if (isRetry) return false;
    A.role = null; A.waiting = null; show();
    note(`Couldn't reach ${label || 'that room'}. The host may have just closed it. Try another room or host your own.`, true);
    return false;
  }
  A.via = via;
  if (!isRetry) { A.waiting = { title: 'Connected!', text: `Got through by ${Net.VIA_LABEL[via]}. Saying hi to the host…` }; show(); }
  Net.sendHost({ t: 'hello', cid, dev, name: prof.name, avatar: prof.avatar, color: prof.color, v: 1 });
  flushOutbox();
  return true;
}
async function lost() {
  if (A.role !== 'guest' || A.leaving || A.reconnecting) return;
  A.reconnecting = true; renderTop();
  const code = A.code, t0 = Date.now();
  while (A.role === 'guest' && A.code === code && !A.leaving && Date.now() - t0 < 180000) {
    const ok = await joinRoom(code, true);
    if (ok) { A.reconnecting = false; renderTop(); toast('Reconnected!', 'good'); return; }
    await new Promise(r => setTimeout(r, 2000));
  }
  if (A.role === 'guest' && !A.leaving) {
    A.reconnecting = false;
    A.waiting = { title: 'Lost the connection', text: "Couldn't get back into the room. The host may have closed it.", spin: false, btns: [['Try again', 'rejoin'], ['Home', 'home']] };
    render();
  }
}
function leaveRoom(silent) {
  A.leaving = true;
  if (A.role === 'host') Room.cmd.closeRoom();
  else if (A.role === 'guest') { if (!silent) toHost({ t: 'leave' }); setTimeout(() => Net.leave(), silent ? 0 : 250); }
  A.role = null; A.v = null; A.code = null; A.chat = []; A.modal = null; A.waiting = null; A.reconnecting = false; A.unread = 0; A.watch = null;
  if (GU.reset) GU.reset();
  document.querySelectorAll('.reqt').forEach(e => e.remove());
  render();
}

/* ============================== INPUT ============================== */
const H = {
  host: () => hostRoom(),
  joinroom: el => { const r = (A.rooms || []).find(x => x.code === el.dataset.code); joinRoom(el.dataset.code, false, r ? r.host + "'s room" : ''); },
  cancelwait: () => leaveRoom(true),
  home: () => leaveRoom(true),
  rejoin: () => { const c = A.code; A.waiting = null; A.role = null; joinRoom(c); },
  rules: () => openModal({ type: 'rules' }),
  profile: () => { A.pick = null; openModal({ type: 'profile' }); },
  pickav: el => { A.pick.avatar = el.dataset.v; A.pick.name = ($('profName') || {}).value || A.pick.name; renderModal(); },
  pickcol: el => { A.pick.color = el.dataset.v; A.pick.name = ($('profName') || {}).value || A.pick.name; renderModal(); },
  saveprof: () => {
    const nm = (($('profName') || {}).value || '').replace(/[<>]/g, '').trim().slice(0, 16);
    if (!nm) return toast('Pick a name', 'err');
    prof = { name: nm, avatar: A.pick.avatar, color: A.pick.color };
    store.set('dd_prof', prof);
    if (A.role) toHost({ t: 'profile', name: prof.name, avatar: prof.avatar, color: prof.color });
    closeModal(); renderHome();
  },
  routes: () => openModal({ type: 'routes' }),
  sound: () => { A.sound = !A.sound; store.set('dd_sound', A.sound); if (A.sound) SFX.unlock(); renderTop(); if (A.modal && A.modal.type === 'menu') renderModal(); },
  side: () => { A.sideOpen = !A.sideOpen; if (A.sideOpen && A.tab === 'chat') A.unread = 0; show(); renderSide(); renderTop(); if (A.v && A.v.phase === 'game') setTimeout(renderGame, 260); },
  tab: el => { A.tab = el.dataset.tab; if (A.tab === 'chat') A.unread = 0; renderSide(); renderTop(); },
  menu: () => openModal({ type: 'menu' }),
  mclose: () => closeModal(),
  player: el => openModal({ type: 'player', cid: el.dataset.cid }),
  seat: el => { const g = game(); const s = g && g.seats[+el.dataset.i]; if (s) openModal({ type: 'player', cid: s.cid }); },
  watch: el => { A.watch = +el.dataset.tb; if (GU.reset) GU.reset(); toHost({ t: 'watch', tb: A.watch }); },
  kick: el => {
    if (!isHost()) return;
    const m = A.v.members.find(x => x.cid === el.dataset.cid);
    if (!m) return;
    if (m.bot) { Room.cmd.removeBot(m.cid); closeModal(); return; }
    confirmBox(`Remove ${m.name}?`, A.v.phase === 'game' ? "They're out of this game, and they have to ask you to come back." : 'They have to ask you to come back in.', 'Remove', () => Room.cmd.kick(m.cid));
  },
  confirmok: () => { const f = A.confirmFn; A.confirmFn = null; closeModal(); if (f) f(); },
  addbot: () => { if (!Room.cmd.addBot()) toast(`The room is full (${GE.MAX_SEATS} players).`, 'err'); },
  set: el => { if (isHost()) Room.cmd.settings({ [el.dataset.k]: el.dataset.v }); },
  setb: el => { if (isHost()) Room.cmd.settings({ [el.dataset.k]: !A.v.settings[el.dataset.k] }); },
  start: () => { const e = Room.cmd.start(); if (e) toast(e, 'err'); },
  leave: () => confirmBox('Leave the room?', A.v && A.v.phase === 'game' && game() && game().phase !== 'over' ? "You'll be out of this game." : 'You can join again from Open rooms.', 'Leave', () => leaveRoom(false)),
  closeroom: () => confirmBox('Close the room?', 'Everyone gets disconnected and the game ends.', 'Close room', () => leaveRoom(false)),
  endgame: () => confirmBox('End this game?', 'Nobody wins this round. You can play again right after.', 'End game', () => Room.cmd.endGame()),
  tolobby: () => { closeModal(); Room.cmd.toLobby(); },
  again: () => { const e = Room.cmd.again(); if (e) toast(e, 'err'); },
  viewtable: () => { A.endHidden = true; renderGame(); },
  showend: () => { A.endHidden = false; renderGame(); },
  accept: el => Room.cmd.accept(+el.dataset.id),
  deny: el => Room.cmd.deny(+el.dataset.id),
};
Object.assign(H, GU.handlers || {});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (e.target.id === 'modal' && A.modal && A.modal.type !== 'confirm') closeModal(); return; }
  if (el.disabled) return;
  SFX.unlock();
  const f = H[el.dataset.act];
  if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.set;
  if (k && isHost()) Room.cmd.settings({ [k]: isNaN(+e.target.value) ? e.target.value : +e.target.value });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && A.modal) { closeModal(); return; }
  if (e.key === 'Enter' && document.activeElement === $('nameIn')) { hostRoom(); return; }
  if (GU.key && !A.modal && document.activeElement !== $('chatIn') && document.activeElement !== $('nameIn')) GU.key(e);
});
$('chatForm').addEventListener('submit', e => {
  e.preventDefault();
  const i = $('chatIn'), t = i.value.trim();
  if (!t) return;
  i.value = '';
  toHost({ t: 'chat', text: t });
});
$('nameIn').addEventListener('change', () => { const v = $('nameIn').value.replace(/[<>]/g, '').trim().slice(0, 16); if (v) { prof.name = v; store.set('dd_prof', prof); } });
let rz = null;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (A.v && A.v.phase === 'game') renderGame(); }, 120); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) Net.checkAlive(); });
window.addEventListener('beforeunload', () => { if (A.role === 'guest') Net.leave(); });

/* ============================== START ============================== */
show();
requestAnimationFrame(frame);
if (/[?&]auto=/.test(location.search)) {     // test helper: ?auto=host&name=X or ?auto=CODE&name=X
  const p = new URLSearchParams(location.search);
  if (p.get('name')) { $('nameIn').value = p.get('name'); }
  setTimeout(() => { if (p.get('auto') === 'host') hostRoom(); else joinRoom(p.get('auto')); }, 50);
}
window.__dd = { A, Room, Net, act, toHost, H, GU };
})();

</script>
</body>
