<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c11">
<title>Flip</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='6' y='6' width='88' height='88' rx='22' fill='%2309090c'/><circle cx='50' cy='50' r='26' fill='%23d9d9e0'/><circle cx='42' cy='41' r='8' fill='white' opacity='.45'/></svg>">
<style>

:root{
  --bg:#0a0c11; --bg2:#10141c; --panel:#151a24; --panel2:#1b2130; --line:#283043; --line2:#344059;
  --text:#e9edf5; --muted:#8a95ab; --dim:#5d6780;
  --red:#ff4d5a; --red2:#b3202c; --gold:#f7c948; --teal:#2ed3b0; --orange:#ff9636; --purple:#a97bff; --yellow:#ffd84a; --blue:#4da3ff; --green:#5be08b;
  --felt1:#1d5a46; --felt2:#0d2b22; --rim:#3b2a18;
  --cw:108px; --ch:154px; --av:54px;
  --r:14px;
  font-family: ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden}
body{background:radial-gradient(1200px 700px at 50% -10%, #1a2133 0%, var(--bg) 60%) fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:inherit}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr}
#topbar{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:linear-gradient(#0e121a,#0b0e14);border-bottom:1px solid var(--line);z-index:5}
.tb-left{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.tb-right{flex:1;display:flex;justify-content:flex-end;align-items:center;gap:6px}
.mini-logo{font-weight:900;letter-spacing:.12em;font-size:15px;white-space:nowrap}
.mini-logo b{color:var(--red);margin-left:4px}
.code-chip{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line2);font-weight:800;letter-spacing:.18em}
.code-chip .lbl{font-size:10px;color:var(--muted);letter-spacing:.12em}
.code-chip .cp{opacity:.6;letter-spacing:0}
.icon-btn{position:relative;width:38px;height:38px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:17px;display:grid;place-items:center}
.icon-btn:hover{border-color:var(--line2);background:var(--panel2)}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.net{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:6px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);white-space:nowrap}
.net i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.net.warn i{background:var(--yellow);box-shadow:0 0 8px var(--yellow)}
.net.bad i{background:var(--red);box-shadow:0 0 8px var(--red)}
#main{grid-row:2;grid-column:1;position:relative;min-height:0;min-width:0;overflow:hidden}
.screen{position:absolute;inset:0;overflow:auto}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2);font-weight:700;transition:transform .08s, background .15s, border-color .15s}
.btn:hover{border-color:#4a5878;background:#222a3c}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#ff5a66,#d92d3b);border-color:#ff7a84;color:#fff;box-shadow:0 6px 20px rgba(255,77,90,.25)}
.btn.primary:hover{background:linear-gradient(180deg,#ff6b76,#e33845)}
.btn.gold{background:linear-gradient(180deg,#ffd76a,#f0b429);border-color:#ffe08a;color:#2b1d00}
.btn.ghost{background:transparent}
.btn.small{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.big{padding:15px 26px;font-size:17px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}

/* ---------- home ---------- */
#scr-home{display:grid;place-items:center;padding:20px}
.home-card{width:min(440px,100%);display:flex;flex-direction:column;gap:14px;padding:26px 22px;border-radius:22px;background:linear-gradient(180deg,rgba(27,33,48,.92),rgba(16,20,28,.92));border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.logo{text-align:center;margin-bottom:4px}
.logo-cards{height:96px;position:relative;margin:0 auto 6px;width:200px}
.logo-cards .lc{position:absolute;left:50%;top:6px;width:62px;height:88px;border-radius:10px;display:grid;place-items:center;font-size:30px;border:2px solid;background:#141824;box-shadow:0 10px 24px rgba(0,0,0,.5)}
.logo-cards .lc:nth-child(1){transform:translateX(-110%) rotate(-16deg);border-color:var(--teal)}
.logo-cards .lc:nth-child(2){transform:translateX(-50%) translateY(-6px);border-color:var(--red);z-index:2;box-shadow:0 0 30px rgba(255,77,90,.4)}
.logo-cards .lc:nth-child(3){transform:translateX(10%) rotate(16deg);border-color:var(--gold)}
.logo h1{margin:0;font-size:46px;font-weight:950;letter-spacing:.14em;line-height:1}
.logo h1 span{color:var(--red);margin-left:10px}
.tag{margin:8px 0 0;color:var(--muted)}
.profile-row{display:flex;gap:10px;align-items:center}
.avatar{width:var(--av);height:var(--av);border-radius:50%;display:grid;place-items:center;font-size:calc(var(--av)*.52);background:radial-gradient(circle at 35% 30%, color-mix(in srgb,var(--c,#3e9bff) 75%, #fff 25%), var(--c,#3e9bff) 70%);box-shadow:inset 0 -4px 10px rgba(0,0,0,.35),0 4px 12px rgba(0,0,0,.35);flex:none;line-height:1}
.avatar.big{--av:58px}
.field{flex:1;padding:14px 14px;border-radius:12px;background:#0d1118;border:1px solid var(--line2);outline:none;font-size:16px}
.field:focus{border-color:var(--blue)}
.join-row{display:flex;gap:10px}
.join-row .field{text-transform:uppercase;letter-spacing:.3em;font-weight:800;text-align:center}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;padding:10px;border-radius:12px;background:#0d1118;border:1px solid var(--line)}
.picker button{height:40px;border-radius:10px;font-size:22px;background:var(--panel)}
.picker button.on{outline:2px solid var(--blue);background:var(--panel2)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid transparent}
.swatches button.on{border-color:#fff}
.home-note{font-size:13px;color:var(--muted);text-align:center;min-height:18px}
.home-note.err{color:var(--red)}
.or{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:12px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- waiting ---------- */
#scr-wait{display:grid;place-items:center;padding:20px}
.wait-card{width:min(420px,100%);text-align:center;padding:30px 24px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}
.wait-card h2{margin:14px 0 6px}
.wait-card p{color:var(--muted);margin:0 0 16px}
.spinner{width:46px;height:46px;margin:0 auto;border-radius:50%;border:4px solid var(--line2);border-top-color:var(--red);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.route-steps{display:flex;flex-direction:column;gap:6px;text-align:left;margin:0 auto 16px;max-width:280px}
.route-steps div{font-size:13px;color:var(--dim)}
.route-steps div.on{color:var(--text)}
.route-steps div.on:before{content:""}
.route-steps div.done:before{content:"✓ ";color:var(--green)}

/* ---------- lobby ---------- */
#scr-lobby{padding:18px}
.lobby{max-width:1050px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-bottom:30px}
.lobby-head{display:flex;flex-wrap:wrap;gap:14px;align-items:stretch}
.code-big{flex:1;min-width:250px;padding:16px 18px;border-radius:18px;background:linear-gradient(135deg,#251620,#151a24 60%);border:1px solid #4a2633;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.code-big .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.code-big .code{font-size:40px;font-weight:950;letter-spacing:.24em;color:#fff;text-shadow:0 0 24px rgba(255,77,90,.45)}
.routes{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--panel);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.routes b{width:100%;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.rchip{padding:4px 9px;border-radius:999px;background:var(--bg2);border:1px solid var(--line)}
.rchip.on{color:var(--green);border-color:#24533a}
.rchip.fail{color:var(--red);border-color:#5a2730}
.rchip.retry{color:var(--yellow)}
.lobby-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px}
.panel{padding:16px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.panel h3{margin:0 0 12px;font-size:15px;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.panel h3 span{color:var(--muted);font-weight:600}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.prow:hover{border-color:var(--line2)}
.prow .avatar{--av:42px}
.prow .who{flex:1;min-width:0}
.prow .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .sub{font-size:12px;color:var(--muted)}
.tagp{font-size:10px;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:6px;background:var(--panel2);color:var(--muted);margin-left:6px;vertical-align:2px}
.tagp.host{background:#3a2a0a;color:var(--gold)}
.tagp.you{background:#0f2f3a;color:var(--teal)}
.tagp.bot{background:#222a3c;color:#a9b6d3}
.x-btn{width:32px;height:32px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-size:14px;flex:none}
.x-btn:hover{color:var(--red);border-color:#6a2a33}
.empty-slot{padding:12px;border-radius:14px;border:1px dashed var(--line2);color:var(--dim);text-align:center;font-size:13px}
.row-btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.setup .srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.setup .srow:last-child{border-bottom:0}
.setup .sl{font-size:14px}
.setup .sl small{display:block;color:var(--muted);font-size:12px}
.stepper{display:flex;align-items:center;border-radius:10px;border:1px solid var(--line2);overflow:hidden;background:var(--bg2)}
.stepper button{width:34px;height:34px;font-size:18px;font-weight:800}
.stepper button:hover{background:var(--panel2)}
.stepper span{min-width:46px;text-align:center;font-weight:800}
.seg{display:flex;border-radius:10px;border:1px solid var(--line2);overflow:hidden}
.seg button{padding:8px 12px;font-size:13px;font-weight:700;color:var(--muted);background:var(--bg2)}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 -2px 0 var(--red)}
.seg button[disabled]{opacity:.4}
.tog{width:46px;height:26px;border-radius:13px;background:var(--line2);position:relative;flex:none;transition:background .15s}
.tog:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:var(--teal)}
.tog.on:after{left:23px}
.sel{padding:8px 10px;border-radius:10px;background:var(--bg2);border:1px solid var(--line2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:6px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--bg2);border:1px solid var(--line2);color:var(--muted)}
.chip.on{color:var(--text);border-color:var(--teal);background:#0e2a26}
.locked .stepper button,.locked .seg button,.locked .tog,.locked .sel,.locked .chip{pointer-events:none}
.locked .stepper button{opacity:.3}
.lobby-foot{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted)}
.soon{font-size:12px;color:var(--dim);margin-top:4px}

/* ---------- side panel ---------- */
#side{grid-row:2;grid-column:2;width:310px;display:flex;flex-direction:column;background:var(--bg2);border-left:1px solid var(--line);min-height:0;z-index:6}
.side-tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line)}
.side-tabs button{flex:1;padding:8px;border-radius:10px;font-weight:800;color:var(--muted)}
.side-tabs button.on{background:var(--panel2);color:var(--text)}
.side-tabs .side-x{flex:none;width:36px;display:none}
.side-body{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:0}
.msg{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.35}
.msg .avatar{--av:26px}
.msg .mt{min-width:0;word-wrap:break-word;overflow-wrap:anywhere}
.msg .mn{font-weight:800;font-size:12px}
.msg.sys{font-size:12px;color:var(--muted);justify-content:center;text-align:center;padding:2px 6px}
.logl{font-size:13px;line-height:1.35;color:#c9d1e2;padding:5px 8px;border-radius:8px;background:rgba(255,255,255,.02)}
.logl.death{color:#ff8a93;background:rgba(255,77,90,.08)}
.logl.angel{color:#ffe28a;background:rgba(247,201,72,.07)}
.logl.win{color:#9cf5c0;background:rgba(91,224,139,.09);font-weight:700}
.logl.cancel{color:#ffb380}
.logl.turn{color:var(--muted)}
.logl.sys{color:var(--muted);font-style:italic}
#chatForm{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);padding-bottom:max(8px,env(safe-area-inset-bottom))}
#chatForm input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;background:#0d1118;border:1px solid var(--line2);outline:none}
#chatForm button{padding:0 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line2);font-weight:800}

/* ---------- game ---------- */
#scr-game{display:flex;flex-direction:column;overflow:hidden}
#table{position:relative;flex:1;min-height:250px}
.felt{position:absolute;left:8%;right:8%;top:12%;bottom:10%;border-radius:50%;background:radial-gradient(ellipse at 50% 45%, var(--felt1), var(--felt2) 75%);box-shadow:0 0 0 10px #22180e,0 0 0 13px #4a3520,0 25px 60px rgba(0,0,0,.6),inset 0 0 80px rgba(0,0,0,.55)}
.felt:after{content:"DEAD DEAL";position:absolute;left:50%;top:84%;transform:translate(-50%,-50%);font-weight:950;letter-spacing:.4em;font-size:12px;color:rgba(255,255,255,.07);white-space:nowrap}
#seats{position:absolute;inset:0;pointer-events:none}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:auto;cursor:pointer;width:96px;transition:left .4s,top .4s}
.seat .avwrap{position:relative}
.seat .ring{position:absolute;inset:-7px;pointer-events:none}
.seat .ring circle{fill:none;stroke-width:4}
.seat .ring .bg{stroke:rgba(255,255,255,.08)}
.seat .ring .fg{stroke:var(--gold);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke .3s}
.seat .nm{font-size:13px;font-weight:800;max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 6px #000}
.seat .meta{display:flex;gap:4px;align-items:center}
.seat .cnt{font-size:12px;font-weight:800;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12)}
.seat .x2{font-size:11px;font-weight:900;padding:2px 6px;border-radius:999px;background:var(--red);color:#fff}
.seat .st{position:absolute;right:-6px;bottom:-4px;font-size:14px;filter:drop-shadow(0 2px 2px #000)}
.seat.cur .avatar{box-shadow:0 0 0 3px var(--gold),0 0 26px rgba(247,201,72,.55)}
.seat.out{opacity:.38;filter:grayscale(1)}
.seat.away .avatar{opacity:.55}
.seat.me .nm{color:var(--teal)}
.seat.tg{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.07)}}
#center{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.piles{display:flex;align-items:center;gap:16px}
.pile{position:relative;width:74px;height:104px;border-radius:11px}
.pile.deck{background:repeating-linear-gradient(45deg,#2a1218 0 8px,#3a161e 8px 16px);border:2px solid #6a2a35;box-shadow:3px 3px 0 #1a0b0f,6px 6px 0 #12070a,0 14px 30px rgba(0,0,0,.6);display:grid;place-items:center}
.pile.deck .dn{font-size:26px;font-weight:950;text-shadow:0 2px 8px #000}
.pile.deck .dl{position:absolute;bottom:6px;width:100%;text-align:center;font-size:10px;letter-spacing:.12em;color:#ffb3bb}
.pile.deck.wiggle{animation:wiggle .5s}
@keyframes wiggle{20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
.pile.disc{border:2px dashed rgba(255,255,255,.18);display:grid;place-items:center}
.pile.disc .mini{position:absolute;inset:0}
.meter{width:64px;display:flex;flex-direction:column;align-items:center;gap:4px}
.meter .sk{font-size:26px;filter:drop-shadow(0 0 10px rgba(255,77,90,.5))}
.meter .bar{width:14px;height:64px;border-radius:7px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15);position:relative;overflow:hidden}
.meter .bar i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,#ff4d5a,#ffb02e);transition:height .4s}
.meter .pc{font-weight:950;font-size:16px}
.meter .pl{font-size:10px;color:#cfd6e4;letter-spacing:.06em;text-align:center}
.infol{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:340px}
.dir{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.12)}
.dir .ic{display:inline-block;transition:transform .5s}
.chainb{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:rgba(80,60,0,.6);border:1px solid #8a6c10;color:#ffe08a}
#stackbar{position:absolute;left:50%;top:5%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(560px,94%)}
.stk{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.sitem{font-size:13px;font-weight:800;padding:6px 10px;border-radius:12px;background:rgba(12,14,20,.92);border:1px solid var(--line2);box-shadow:0 6px 18px rgba(0,0,0,.5);animation:popin .25s}
.sitem.off{text-decoration:line-through;opacity:.55}
.sitem.q{border-color:#8a7414}
.rbar{width:100%;height:6px;border-radius:3px;background:rgba(0,0,0,.6);overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.rbar i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange));width:100%}
.rlabel{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--yellow);text-shadow:0 1px 4px #000}
@keyframes popin{from{transform:scale(.6);opacity:0}}

#bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(0deg,#0d1017,rgba(13,16,23,.6));border-top:1px solid var(--line);min-height:62px;flex-wrap:wrap}
.status{flex:1;min-width:160px}
.status .s1{font-weight:850;font-size:15px}
.status .s2{font-size:12px;color:var(--muted)}
.tbar{height:4px;border-radius:2px;background:var(--line);margin-top:5px;overflow:hidden;max-width:300px}
.tbar i{display:block;height:100%;background:var(--gold);width:100%}
.tbar.low i{background:var(--red)}
.react{display:flex;align-items:center;gap:6px;padding:6px;border-radius:14px;background:linear-gradient(90deg,rgba(255,216,74,.18),rgba(255,150,54,.12));border:1px solid #8a7414;animation:glow 1s infinite alternate}
.react .rl{font-weight:900;color:var(--yellow);font-size:13px;padding:0 4px}
.react button{padding:9px 12px;border-radius:10px;background:#2b2410;border:1px solid #b8951c;font-weight:900;font-size:14px}
.react button:hover{background:#3d3214}
@keyframes glow{to{box-shadow:0 0 18px rgba(255,216,74,.35)}}
.drawbtn{min-width:132px}
#detail{padding:0 12px}
.det{display:flex;align-items:center;gap:12px;padding:10px 12px;margin:8px 0 0;border-radius:14px;background:var(--panel);border:1px solid var(--line2);animation:popin .15s}
.det .de{font-size:30px}
.det .dt{flex:1;min-width:0}
.det .dn{font-weight:900}
.det .dk{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-left:6px}
.det .dd{font-size:13px;color:#c5cde0}
.det .why{font-size:12px;color:var(--orange);margin-top:2px}
#hand{display:flex;align-items:flex-end;gap:0;padding:10px 14px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom));overflow-x:auto;overflow-y:hidden;min-height:calc(var(--ch) + 30px);scrollbar-width:thin}
#hand .hint{color:var(--dim);font-size:14px;margin:auto}
.hand-inner{display:flex;align-items:flex-end;margin:0 auto;padding-top:16px}

/* ---------- cards ---------- */
.card{--k:var(--teal);position:relative;flex:none;width:var(--cw);height:var(--ch);border-radius:13px;padding:8px;display:flex;flex-direction:column;align-items:center;background:linear-gradient(165deg,#222838,#141824 70%);border:2px solid color-mix(in srgb,var(--k) 70%, #000 30%);box-shadow:0 8px 20px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);transition:transform .15s, margin .2s, box-shadow .15s;cursor:pointer;user-select:none;text-align:center;overflow:hidden}
.card+.card{margin-left:var(--ov,8px)}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--k)}
.card .ck{align-self:stretch;display:flex;justify-content:space-between;font-size:9px;font-weight:900;letter-spacing:.08em;color:color-mix(in srgb,var(--k) 85%, #fff 15%);text-transform:uppercase;margin-top:2px}
.card .ca{width:58px;height:58px;margin:6px 0 4px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:radial-gradient(circle,color-mix(in srgb,var(--k) 35%, transparent),transparent 70%)}
.card .cn{font-weight:900;font-size:13px;letter-spacing:.02em}
.card .cd{font-size:9.5px;line-height:1.25;color:#aab3c7;margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.card.k-death{--k:var(--red);background:linear-gradient(165deg,#2a0d12,#120609 70%)}
.card.k-support{--k:var(--teal)}
.card.k-target{--k:var(--orange)}
.card.k-quick{--k:var(--yellow)}
.card.k-wild{--k:var(--purple)}
.card.a-angel{--k:var(--gold);background:linear-gradient(165deg,#2c2610,#15130a 70%)}
#hand .card:hover{transform:translateY(-8px)}
#hand .card.sel{transform:translateY(-18px);box-shadow:0 0 0 3px #fff,0 16px 30px rgba(0,0,0,.6)}
#hand .card.no{filter:saturate(.6) brightness(.82)}
#hand .card.ok.k-quick.live{box-shadow:0 0 0 2px var(--yellow),0 0 22px rgba(255,216,74,.5)}
#hand .card.new{animation:newcard .9s}
@keyframes newcard{0%{transform:translateY(-40px) scale(.7);opacity:0}60%{transform:translateY(-12px)}}
.card.mini{--cw:74px;--ch:104px;padding:5px;cursor:default}
.card.mini .ca{width:40px;height:40px;font-size:24px;margin:4px 0 2px}
.card.mini .cd{display:none}
.card.mini .cn{font-size:11px}
.cardrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cardrow .lab{font-size:11px;font-weight:800;color:var(--muted);text-align:center;margin-top:4px;letter-spacing:.08em;text-transform:uppercase}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(4,6,10,.62);backdrop-filter:blur(3px);animation:fade .15s}
@keyframes fade{from{opacity:0}}
.mbox{width:min(460px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px;border-radius:20px;background:linear-gradient(180deg,#1b2130,#131824);border:1px solid var(--line2);box-shadow:0 30px 80px rgba(0,0,0,.6);animation:popin .18s}
.mbox.wide{width:min(720px,100%)}
.mbox h2{margin:0 0 6px;font-size:20px}
.mbox p{color:var(--muted);margin:0 0 14px;font-size:14px}
.mbtns{display:flex;flex-direction:column;gap:8px}
.mbtns.row{flex-direction:row;flex-wrap:wrap}
.mbtns.row .btn{flex:1}
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.tbtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border-radius:14px;background:var(--bg2);border:1px solid var(--line2);font-weight:800}
.tbtn:hover{border-color:var(--orange)}
.tbtn .avatar{--av:44px}
.tbtn small{color:var(--muted);font-weight:600}
.cbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:4px 0 14px}
.cbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--red),var(--orange))}
.pcard{text-align:center}
.pcard .avatar{--av:84px;margin:0 auto 10px}
.pcard h2{margin-bottom:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left;margin:14px 0;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)}
.rules h3{margin:16px 0 6px;font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold)}
.rules ul{margin:0;padding-left:20px;color:#c9d1e2;font-size:14px;line-height:1.5}
.rtable{display:flex;flex-direction:column;gap:6px}
.rtable div{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:7px 9px;border-radius:10px;background:var(--bg2)}
.rtable b{white-space:nowrap}
.rtable .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}

/* ---------- toasts ---------- */
#toasts{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(440px,94vw)}
.toast{pointer-events:auto;padding:10px 14px;border-radius:12px;background:rgba(22,27,38,.97);border:1px solid var(--line2);box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:14px;font-weight:650;animation:tin .25s;display:flex;gap:10px;align-items:center}
.toast.err{border-color:#7a2a33;color:#ffb3b9}
.toast.good{border-color:#2a6a45}
.toast.req{border-color:#8a6c10;flex-wrap:wrap}
.toast .tb{display:flex;gap:6px;margin-left:auto}
.toast.out{animation:tout .3s forwards}
@keyframes tin{from{transform:translateY(-12px);opacity:0}}
@keyframes tout{to{transform:translateY(-12px);opacity:0}}
.banner{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:55;pointer-events:none;font-size:clamp(30px,7vw,64px);font-weight:950;letter-spacing:.06em;text-shadow:0 6px 30px rgba(0,0,0,.8);animation:bannr 1.4s forwards;white-space:nowrap}
@keyframes bannr{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}15%{transform:translate(-50%,-50%) scale(1.08);opacity:1}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}
.rebanner{position:fixed;top:56px;left:0;right:0;z-index:40;text-align:center;padding:6px;background:#5a4410;color:#ffe9a8;font-weight:800;font-size:13px}

/* ---------- effects ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.fly{position:fixed;left:0;top:0;width:52px;height:74px;margin:-37px 0 0 -26px;border-radius:9px;display:grid;place-items:center;font-size:26px;background:linear-gradient(165deg,#222838,#141824);border:2px solid var(--line2);box-shadow:0 10px 24px rgba(0,0,0,.6)}
.fly.back{background:repeating-linear-gradient(45deg,#2a1218 0 6px,#3a161e 6px 12px);border-color:#6a2a35}
.pop{position:fixed;transform:translate(-50%,-50%);font-size:46px;animation:popfx 1.3s forwards;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6));font-weight:950;white-space:nowrap}
@keyframes popfx{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}20%{transform:translate(-50%,-50%) scale(1.25);opacity:1}40%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-50%,-140%) scale(1);opacity:0}}
.flash{position:fixed;inset:0;animation:flash .6s forwards}
@keyframes flash{from{opacity:.55}to{opacity:0}}
.shake{animation:shake .5s}
@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(6px)}30%,50%,70%{transform:translateX(-10px)}40%,60%{transform:translateX(10px)}}
#confetti{position:fixed;inset:0;z-index:58;pointer-events:none}

/* end screen */
.endcard{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(5,7,11,.72);backdrop-filter:blur(2px);padding:16px}
.endbox{width:min(440px,100%);text-align:center;padding:24px;border-radius:22px;background:linear-gradient(180deg,#1f2738,#141925);border:1px solid #4a5878;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:popin .3s}
.endbox .trophy{font-size:64px;line-height:1}
.endbox h2{margin:8px 0 2px;font-size:26px}
.places{display:flex;flex-direction:column;gap:6px;margin:16px 0}
.place{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);text-align:left}
.place .pn{width:26px;font-weight:950;color:var(--muted)}
.place.first{border-color:#8a6c10;background:#221c0a}
.place.first .pn{color:var(--gold)}
.place .avatar{--av:32px}

.pchip.cur{border-color:var(--pc);box-shadow:0 0 0 2px var(--pc),0 0 18px color-mix(in srgb,var(--pc) 45%,transparent)}

/* =================== FLIP: felt and wood =================== */
:root{--acc:#2fbf71;--acc2:#1d8a4f;--acc3:#6fe3a2;--tint:#10291d}
.rim8{padding:16px;border-radius:18px;background:linear-gradient(145deg,#7a4a26,#4a2a12 55%,#5c3519);box-shadow:inset 0 2px 0 rgba(255,220,170,.25),inset 0 -3px 0 rgba(0,0,0,.35),0 30px 60px rgba(0,0,0,.6);transition:box-shadow .3s}
.rim8.active{box-shadow:inset 0 2px 0 rgba(255,220,170,.25),inset 0 -3px 0 rgba(0,0,0,.35),0 0 0 3px rgba(47,191,113,.6),0 30px 60px rgba(0,0,0,.6)}
.felt8{display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);gap:2px;padding:2px;border-radius:6px;background:#0c3a22;box-shadow:inset 0 0 30px rgba(0,0,0,.5)}
.felt8 .sq{position:relative;background:radial-gradient(circle at 50% 40%,#22874f,#16673a);border-radius:2px;display:grid;place-items:center}
.felt8 .sq.ok{cursor:pointer}
.felt8 .sq.ok:hover{background:radial-gradient(circle at 50% 40%,#2aa060,#1a7a45)}
.felt8 .sq.last:after{content:"";position:absolute;width:16%;height:16%;border-radius:50%;background:#ffd84a;box-shadow:0 0 8px #ffd84a;z-index:2}
.felt8 .disc{width:82%;height:82%;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--dc) 70%,#fff 30%),var(--dc) 55%,color-mix(in srgb,var(--dc) 70%,#000 30%));box-shadow:0 3px 0 rgba(0,0,0,.45),0 5px 10px rgba(0,0,0,.35);transition:transform .2s}
.felt8 .disc.flip{animation:flip8 .5s ease-in-out}
@keyframes flip8{0%{transform:rotateY(0) scale(1)}50%{transform:rotateY(90deg) scale(1.12)}100%{transform:rotateY(0) scale(1)}}
.felt8 .disc.drop{animation:drop8 .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes drop8{from{transform:scale(1.6);opacity:0}}
.felt8 .disc.will{transform:scale(.86);box-shadow:0 0 0 3px #ffd84a,0 0 14px #ffd84a;animation:will8 .7s infinite alternate}
@keyframes will8{to{transform:scale(.8)}}
.felt8 .disc.ghost{opacity:.55;box-shadow:none}
.felt8 .hint{position:relative;width:100%;height:100%;display:grid;place-items:center}
.felt8 .hint:before{content:"";position:absolute;width:18%;height:18%;border-radius:50%;background:rgba(0,0,0,.35)}
.felt8 .sq.free .hint:before{width:46%;height:46%;background:none;border:2px dashed rgba(255,255,255,.35)}
.felt8 .hint .disc{position:absolute}
.felt8 .hint em{position:absolute;top:2px;right:4px;font-style:normal;font-weight:900;font-size:12px;color:#ffd84a;text-shadow:0 1px 2px #000}
.mini8{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(255,255,255,.4);margin-top:2px}


/* ================= Matt's Game Room look (same as Wall Go II) ================= */
:root{--bg:#09090c;--bg2:#0f0f14;--panel:#121218;--panel2:#1c1c25;--line:#262630;--line2:#33333f;--text:#eeedf2;--muted:#a3a2af;--dim:#6d6c7a;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{background:radial-gradient(1100px 700px at 30% 0%,#181820 0,transparent 62%) no-repeat,var(--bg)}
#topbar{background:rgba(9,9,12,.86);backdrop-filter:blur(6px)}
.btn{border-radius:10px;background:#1c1c25;border-color:var(--line);font-weight:600}
.btn:hover{background:#242430;border-color:var(--line2)}
.btn.primary{background:#eeedf2;border-color:#eeedf2;color:#0b0b0f;box-shadow:none}
.btn.primary:hover{background:#fff}
.btn.primary[disabled]{background:#3a3a46;border-color:#3a3a46;color:#a3a2af}
.icon-btn{border-radius:10px;background:var(--panel);border-color:var(--line);color:var(--text)}
.icon-btn .ic,.btn .ic{width:19px;height:19px;display:block}
.home-card,.mbox,.endbox,.panel,.card{background:linear-gradient(180deg,#17171f,#0f0f14)}
.field,input.field,select.field{background:#0b0b0f;border-color:var(--line)}
.field:focus{border-color:#eeedf2}
.avatar{background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--c,#3c8cff) 45%,#fff) 0,var(--c,#3c8cff) 42%,color-mix(in srgb,var(--c,#3c8cff) 60%,#000) 100%);
  box-shadow:0 2px 0 color-mix(in srgb,var(--c,#3c8cff) 40%,#000),0 5px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35);font-size:0;color:#fff}
.avatar .mk{width:56%;height:56%;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.picker button{display:grid;place-items:center;font-size:0;background:#1c1c25}
.picker button .mk{width:22px;height:22px}
.picker button .mk *{fill:#eeedf2}
.picker button .mk [stroke]{stroke:#eeedf2;fill:none}
.endbox .trophy{font-size:0;line-height:0;display:grid;place-items:center}
.endbox .trophy .big-ic{width:72px;height:72px}
</style>
</head>
<body>
<div id="app">
  <header id="topbar" class="hidden">
    <div class="tb-left"><a class="mini-logo" href="./" title="Back to Matt's Game Room" style="color:inherit;text-decoration:none">FLIP<b>●</b></a><span class="room-chip"><i></i><span id="tbRoom">Room</span></span></div>
    <div class="tb-right">
      <button class="net" id="tbNet" data-act="routes"><i></i><span id="tbNetTxt">Online</span></button>
      <button class="icon-btn" data-act="sound" id="tbSound" title="Sound"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M4 9h3.5L12 5v14l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <button class="icon-btn" data-act="side" id="tbChat" title="Chat &amp; log"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8l-5 3.5V17H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span class="badge hidden" id="tbUnread"></span></button>
      <button class="icon-btn" data-act="menu" title="Menu"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></button>
    </div>
  </header>
  <main id="main">
    <section id="scr-home" class="screen">
      <div class="home-wrap">
      <div class="home-card">
        <div class="logo">
          <div class="logo-art" aria-hidden="true"><svg viewBox="0 0 150 112" xmlns="http://www.w3.org/2000/svg"><rect x="18" y="4" width="114" height="104" rx="10" fill="#5c3519"/><rect x="26" y="12" width="98" height="88" rx="4" fill="#16673a"/><g stroke="#0c3a22" stroke-width="2"><path d="M50.5 12v88M75 12v88M99.5 12v88M26 34h98M26 56h98M26 78h98"/></g><g><circle cx="62.7" cy="45" r="9" fill="#24262e"/><circle cx="87.2" cy="45" r="9" fill="#f2f2f2"/><circle cx="62.7" cy="67" r="9" fill="#e8424f"/><circle cx="87.2" cy="67" r="9" fill="#3b8cff"/><circle cx="111.7" cy="67" r="9" fill="#24262e"/><circle cx="38.2" cy="23" r="9" fill="#f2f2f2"/></g><ellipse cx="111.7" cy="45" rx="3" ry="9" fill="#f2f2f2" stroke="#24262e" stroke-width="1"/></svg></div>
          <h1>FL<span>I</span>P</h1>
          <p class="tag">Trap a line. Flip it to your colour. Most discs wins.</p>
        </div>
        <div class="profile-row">
          <button class="avatar big" id="homeAv" data-act="profile" title="Change avatar"></button>
          <input class="field" id="nameIn" maxlength="16" placeholder="Your name" autocomplete="off">
        </div>
        <button class="btn primary big" data-act="host">Host a room</button>
        <div class="home-note" id="homeNote"></div>
        <div class="row-btns" style="justify-content:center"><button class="btn ghost small" data-act="rules">How to play</button><a class="btn ghost small" href="./">All games</a></div>
      </div>
      <div class="rooms-card" id="roomsCard"></div>
      </div>
      <div class="vertag" id="verTag"></div>
    </section>
    <section id="scr-wait" class="screen hidden"><div class="wait-card" id="waitCard"></div></section>
    <section id="scr-lobby" class="screen hidden"></section>
    <section id="scr-game" class="screen hidden">
      <div id="players" class="players"></div>
      <div id="tabs"></div>
      <div id="table"></div>
      <div id="bar"></div>
      <div id="endwrap"></div>
    </section>
  </main>
  <aside id="side" class="hidden">
    <div class="side-tabs"><button data-act="tab" data-tab="chat" class="on">Chat</button><button data-act="tab" data-tab="log">Log</button><button class="side-x" data-act="side">✕</button></div>
    <div id="chatList" class="side-body"></div>
    <div id="logList" class="side-body hidden"></div>
    <form id="chatForm" autocomplete="off"><input id="chatIn" maxlength="200" placeholder="Say something…"><button type="submit">Send</button></form>
  </aside>
</div>
<div id="modal" class="hidden"></div>
<div id="toasts"></div>
<div id="fx"></div>

/* =====================================================================
   CORE — the shared turn engine for the classic games.
   A game is one or more TABLES. Games for 3–4 players use one table for

   Each table runs in 'turn' mode (one player acts) or 'simul' mode
   (everyone who still needs to acts, then the round resolves).
   The game file only describes the rules (init / apply / bot / view);

  async function openRoom(handlers, statusCb, wantCode) {
    H = handlers; onStatus = statusCb || onStatus;
    let code = wantCode || makeCode(), r = 'off';

  function tryPeer(code, step, ctl) {
    return new Promise(res => {
      if (!hasPeer() || !want('peer')) return res(null);
      let done = false, p, L = null, iv;
      const fin = v => { if (done) return; done = true; clearTimeout(to); clearInterval(iv); if (!v) { try { p && p.destroy(); } catch (e) { /* */ } } res(v); };

  function tryTrystero(code, step, ctl, via, joinFn) {
    return new Promise(res => {

      const fin = v => { if (done) return; done = true; clearTimeout(to); clearInterval(iv); if (!v) { try { r && r.leave(); } catch (e) { /* */ } } res(v); };

  function tryRelay(code, step, ctl) {

      const fin = v => { if (done) return; done = true; clearTimeout(to); clearInterval(iv); clearInterval(kt); if (!v && P) P.close(); res(v); };

  /* ---------------- public room list: the server browser ----------------

  function heardRoom(raw, at, src) {

  function roomList() {
    const t = Date.now();
    for (const [k, r] of rooms) if (t - r.at > (r.src === 'local' ? 12000 : 70000)) rooms.delete(k);
    return Array.from(rooms.values()).sort((a, b) => (a.phase === 'lobby' ? 0 : 1) - (b.phase === 'lobby' ? 0 : 1) || b.n - a.n || b.at - a.at);
  }
  function tellBrowsers() { const l = roomList(); for (const f of browsers) { try { f(l); } catch (e) { /* */ } } }

      try { if (Math.floor(Date.now() / 1000) - e.created_at > 75) return; heardRoom(JSON.parse(e.content), e.created_at * 1000, 'nostr'); } catch (er) { /* */ }
    });

  }
  async function sendAnnounce(force) {
    const info = annInfo;
    if (!info) return;
    const key = JSON.stringify(info);
    const bc = listBC();
    if (bc) bc.postMessage({ room: info });
    if (!force && key === annSent && Date.now() - annAt < 19000) return;

    } catch (e) { /* the list is a nice-to-have */ }
  }
  // host: announce(info) to list the room, announce(null) to take it down
  function announce(info) {
    const was = annInfo;
    annInfo = info ? cleanRoom(info) : null;
    if (!annInfo) {
      clearInterval(annT); annT = null;
      if (was) { annInfo = Object.assign({}, was, { closed: true }); sendAnnounce(true); annInfo = null; }

})();

  /* ------------------------ what happens → a line ------------------------
     Each returns [speakerCid, lineKey, chance, vars?, priority?] or nothing. */
  const GAMES = {
    dd(e, c) {
      const G = c.G, S = G.seats;
      const nm = i => S[i] ? S[i].name : '';
      switch (e.kind) {
        case 'play': {
          if (c.isBot(e.who)) {
            if (e.card === 'future' || e.card === 'peek') {
              // a hint about the top card that's true about half the time
              const danger = !!(G.deck[0] && G.deck[0].t === 'death');
              const claim = Math.random() < 0.45 ? !danger : danger;
              return [c.cid(e.who), claim ? 'ddWarn' : 'ddSafe', 0.8];
            }
            const k = { cancel: ['ddCancel', 0.45], skip: ['ddSkip', 0.3], shuffle: ['ddShuffle', 0.45], reverse: ['ddReverse', 0.3] }[e.card];
            return k ? [c.cid(e.who), k[0], k[1]] : [c.cid(e.who), 'ddPlay', 0.08];
          }
          if (e.card === 'future' || e.card === 'peek') return [c.bot(), 'ddHumanFuture', 0.3, { t: nm(e.who) }];
          if (e.card === 'shuffle') return [c.bot(), 'ddHumanShuffle', 0.2, { t: nm(e.who) }];
          return null;
        }
        case 'attack':
          if (c.isBot(e.who) && !c.isBot(e.to)) return [c.cid(e.who), 'ddAttack', 0.6, { t: nm(e.to) }];
          if (c.isBot(e.to)) return [c.cid(e.to), 'ddAttacked', c.isBot(e.who) ? 0.3 : 0.6, { t: nm(e.who) }];
          return null;
        case 'move':
          if (c.isBot(e.to) && !c.isBot(e.from)) return [c.cid(e.to), 'ddSteal', 0.5, { t: nm(e.from) }];
          if (c.isBot(e.from) && !c.isBot(e.to)) return [c.cid(e.from), 'ddStolen', 0.5, { t: nm(e.to) }];
          return null;
        case 'draw': {
          const deaths = G.deck.filter(x => x.t === 'death').length;
          if (c.isBot(e.who) && G.deck.length && deaths / G.deck.length >= 0.25) return [c.cid(e.who), 'ddPhew', 0.25];
          return null;
        }
        case 'angel': return c.isBot(e.who) ? [c.cid(e.who), 'ddSaved', 0.7] : [c.bot(), 'ddHumanSaved', 0.45, { t: nm(e.who) }];
        case 'hide': return c.isBot(e.who) ? [c.cid(e.who), 'ddHid', 0.6] : [c.bot(), 'ddHumanHid', 0.45, { t: nm(e.who) }];
        case 'out': return c.isBot(e.who) ? [c.cid(e.who), 'botOut', 0.75, null, 1] : [c.bot(), 'humanOut', 0.6, { t: nm(e.who) }, 1];
        case 'win': return c.isBot(e.who) ? [c.cid(e.who), 'botWin', 0.9, null, 2] : [c.bot(), 'humanWin', 0.75, { w: nm(e.who) }, 2];
      }
      return null;
    },
    pk(e, c) {
      const G = c.G, S = G.seats;
      const nm = i => S[i] ? S[i].name : '';
      const inHand = c.bot(s => !s.folded);
      switch (e.kind) {
        case 'act': {
          if (c.isBot(e.who)) {
            const me = c.cid(e.who);
            if (e.a === 'allin') return [me, 'pkAllin', 0.6];
            // strong or weak talk, picked at random so it tells you nothing
            if (e.a === 'raise' || e.a === 'bet') return [me, Math.random() < 0.5 ? 'pkStrong' : 'pkWeak', 0.4];
            if (e.a === 'call') return [me, 'pkCall', 0.1];
            if (e.a === 'check') return [me, 'pkCheck', 0.08];
            if (e.a === 'fold') return [me, 'pkFold', 0.18];
            return null;
          }
          if (e.a === 'allin') return [inHand, 'pkHumanAllin', 0.6, { t: nm(e.who) }];
          if (e.a === 'raise' || e.a === 'bet') return [inHand, 'pkHumanRaise', 0.22, { t: nm(e.who) }];
          if (e.a === 'fold') return [c.bot(), 'pkHumanFold', 0.06, { t: nm(e.who) }];
          return null;
        }
        case 'street': return e.stage === 'river' ? [inHand, 'pkRiver', 0.1] : null;
        case 'win': {
          const ws = [].concat(e.who || []);
          const b = ws.find(i => c.isBot(i));
          if (b != null) return [c.cid(b), 'pkWin', e.showdown ? 0.5 : 0.3];
          return ws.length ? [c.bot(), 'pkHumanWin', 0.2, { t: nm(ws[0]) }] : null;
        }
        case 'bust': return c.isBot(e.who) ? [c.cid(e.who), 'pkBotBust', 0.8, null, 1] : [c.bot(), 'pkHumanBust', 0.7, { t: nm(e.who) }, 1];
        case 'gameover': return c.isBot(e.winner) ? [c.cid(e.winner), 'botWin', 0.9, null, 2] : [c.bot(), 'humanWin', 0.75, { w: nm(e.winner) }, 2];
      }
      return null;
    },
    dc(e, c) {
      const S = c.G.seats, nm = i => S[i] ? S[i].name : '';
      switch (e.kind) {
        case 'wall': return c.isBot(e.who) ? [c.cid(e.who), 'dcWall', 0.35, { t: c.human() }] : [c.bot(), 'dcHumanWall', 0.3, { t: nm(e.who) }];
        case 'out': return c.isBot(e.who) ? [c.cid(e.who), 'botOut', 0.75, null, 1] : [c.bot(), 'humanOut', 0.5, { t: nm(e.who) }, 1];
        case 'win': return c.isBot(e.who) ? [c.cid(e.who), Math.random() < 0.4 ? 'dcWin' : 'botWin', 0.9, null, 2] : [c.bot(), 'humanWin', 0.75, { w: nm(e.who) }, 2];

    },
    cl(e, c) {
      const S = c.G.seats, nm = i => S[i] ? S[i].name : '';
      switch (e.kind) {
        case 'score': return c.isBot(e.who) ? [c.cid(e.who), 'clScore', e.big ? 0.6 : 0.25] : [c.bot(), 'clHumanScore', e.big ? 0.5 : 0.18, { t: nm(e.who) }];
        case 'hit':
          if (c.isBot(e.who) && e.to != null && !c.isBot(e.to)) return [c.cid(e.who), 'clHit', e.big ? 0.65 : 0.3, { t: nm(e.to) }];
          if (e.to != null && c.isBot(e.to)) return [c.cid(e.to), 'clHitBy', e.big ? 0.65 : 0.3, { t: nm(e.who) }];
          return null;
        case 'close': return c.isBot(e.who) ? [c.cid(e.who), 'clClose', 0.5] : null;
        case 'out': return c.isBot(e.who) ? [c.cid(e.who), 'botOut', 0.75, null, 1] : [c.bot(), 'humanOut', 0.5, { t: nm(e.who) }, 1];
        case 'win': return c.isBot(e.who) ? [c.cid(e.who), 'botWin', 0.9, null, 2] : [c.bot(), 'humanWin', 0.75, { w: nm(e.who) }, 2];
      }
      return null;
    },
    wg(e, c) {
      const S = c.G.seats, nm = i => S[i] ? S[i].name : '';
      switch (e.kind) {
        case 'seal': return c.isBot(e.who) ? [c.cid(e.who), 'wgSeal', 0.55, { n: e.n }] : [c.bot(), 'wgHumanSeal', 0.35, { t: nm(e.who) }];
        case 'break': return c.isBot(e.who) ? [c.cid(e.who), 'wgBreak', 0.6] : [c.bot(), 'wgHumanBreak', 0.4, { t: nm(e.who) }];
        case 'move': return c.isBot(e.who) ? [c.cid(e.who), 'wgMove', 0.1, { t: c.human() }] : null;
        case 'place': return c.isBot(e.who) ? [c.cid(e.who), 'wgPlace', 0.07] : null;
        case 'out': return c.isBot(e.who) ? [c.cid(e.who), 'botOut', 0.75, null, 1] : [c.bot(), 'humanOut', 0.5, { t: nm(e.who) }, 1];
        case 'win': return c.isBot(e.who) ? [c.cid(e.who), 'botWin', 0.9, null, 2] : [c.bot(), 'humanWin', 0.75, { w: nm(e.who) }, 2];
      }
      return null;
    },
  };
  const IDLE = { dd: 'ddIdle', pk: 'pkIdle', dc: 'dcIdle', wg: 'wgIdle', cl: 'clIdle' };

  /* chat replies: what someone typed → which lines fit */
  const HEARD = [
    ['gg', /\bgg\b|good game/i, 0.6],
    ['cheat', /cheat|hack|rigged|scripted|unfair/i, 0.6],
    ['bluff', /bluff|lying|liar|\blie\b|\bfake\b/i, 0.5],
    ['insult', /\b(noob|n00b|bad|trash|suck|sucks|stupid|dumb|loser|garbage|ez|easy|cringe)\b/i, 0.3],
    ['praise', /\b(nice|good one|gj|wp|well played|wow|impressive|smart|genius)\b/i, 0.25],
    ['lol', /\b(lol|lmao|haha+|rofl|xd)\b||/i, 0.25],
    ['hi', /\b(hi|hello|hey+|yo|sup|hiya|howdy)\b/i, 0.45],
    ['question', /\?\s*$/, 0.15],

  function make(game, api) {
    // api: level() 'off'|'some'|'lots', G() (null outside a game), people() [{cid,name,bot,seat,alive}], say(cid,text)
    const st = { lastAny: 0, last: {}, recent: [], timers: new Set(), lastIdle: Date.now(), nextIdleCheck: 0 };
    const lots = () => api.level() === 'lots';

    function ctx() {
      const G = api.G(), P = api.people();
      const seatBot = i => G && G.seats[i] && G.seats[i].bot;
      return {
        G,
        isBot: i => !!seatBot(i),
        cid: i => (G && G.seats[i] ? G.seats[i].cid : null),
        // a random bot still in the game, optionally filtered by its seat
        bot: f => {
          const al = P.filter(p => p.bot && p.alive && p.seat >= 0 && (!f || f(G.seats[p.seat])));
          return al.length ? rnd(al).cid : null;
        },
        human: () => { const h = P.filter(p => !p.bot && p.alive); return h.length ? rnd(h).name : ''; },
      };
    }
    function fill(line, v) {
      return line.replace(/\{(\w+)\}/g, (m, k) => (v[k] != null && v[k] !== '' ? v[k] : '\u0000'));
    }
    function pickLine(key, vars) {
      const pool = L[key] || [];
      const ok = pool.map(l => fill(l, vars)).filter(l => !l.includes('\u0000'));
      const fresh = ok.filter(l => !st.recent.includes(l));
      return (fresh.length ? rnd(fresh) : ok.length ? rnd(ok) : null);
    }
    function speak(cid, key, chance, vars, prio, reply) {
      if (!cid || api.level() === 'off') return false;
      const P = api.people(), me = P.find(p => p.cid === cid && p.bot);
      if (!me) return false;
      const t = Date.now();
      const p = Math.min(1, chance * (lots() ? 1.7 : 1));
      if (Math.random() > p) return false;
      // the end of a game always gets its line; knock-outs barely wait; everything else takes turns
      const gap = reply ? 1500 : prio >= 2 ? 0 : prio ? 1200 : (lots() ? 2500 : 5500);
      const own = reply ? 2500 : prio ? 0 : (lots() ? 7000 : 15000);
      if (t - st.lastAny < gap || t - (st.last[cid] || 0) < own) return false;
      const humans = P.filter(x => !x.bot);
      const v = Object.assign({ me: short(me.name), p: humans.length ? rnd(humans).name : '' }, vars || {});
      const line = pickLine(key, v);
      if (!line) return false;
      st.lastAny = t; st.last[cid] = t; st.lastIdle = t;
      st.recent.push(line); if (st.recent.length > 30) st.recent.shift();
      // a little "typing" pause so it reads like a reply, not an instant echo
      const delay = (reply ? 900 : 500) + Math.min(1600, line.length * 22) + Math.random() * 700;
      const tm = setTimeout(() => { st.timers.delete(tm); if (api.level() !== 'off') api.say(cid, line); }, delay);
      st.timers.add(tm);
      return true;
    }
    function run(r) { if (r && r[0]) speak(r[0], r[1], r[2], r[3], r[4]); }

    return {
      fx(e) {
        const G = api.G();
        if (!G || !e || !GAMES[game]) return;
        try { run(GAMES[game](e, ctx())); } catch (err) { /* banter must never break the game */ }
      },
      start() {
        st.lastIdle = Date.now();
        const c = ctx();
        run([c.bot(), 'start', 0.45]);
      },
      joined(cid) { speak(cid, 'greet', 0.55); },
      heard(name, text) {
        if (api.level() === 'off') return;
        const P = api.people(), bots = P.filter(p => p.bot);
        if (!bots.length) return;
        text = String(text || '');
        const named = bots.find(b => new RegExp('\\b' + short(b.name).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i').test(text));
        const atBots = named || /\bbots?\b/i.test(text);
        const hit = HEARD.find(h => h[1].test(text));
        if (!hit && !atBots) return;
        const pool = bots.filter(b => b.alive || api.G() == null);
        const who = named || (pool.length ? rnd(pool) : rnd(bots));
        const key = hit ? hit[0] : 'mention';
        speak(who.cid, key, atBots ? 0.9 : hit[2], { p: name }, 0, true);
      },
      tick() {
        const t = Date.now();
        if (t < st.nextIdleCheck) return;
        st.nextIdleCheck = t + 1000;
        const G = api.G();
        if (!G || G.phase === 'over' || api.level() === 'off') return;
        const quiet = lots() ? 28000 : 55000;
        if (t - st.lastIdle < quiet) return;
        st.lastIdle = t;   // try again after another quiet stretch either way
        const c = ctx();
        run([c.bot(), Math.random() < 0.55 && IDLE[game] ? IDLE[game] : 'idle', 0.7]);
      },
      stop() { for (const tm of st.timers) clearTimeout(tm); st.timers.clear(); },
    };
  }
  return { make, LINES: L };
})();
window.Banter = Banter;

/* ------------------------- speech bubbles (everyone) -------------------------
   A bot's line pops up over its seat for a few seconds and follows it around
   (the 3D table moves). If the seat isn't on screen, it's just a chat message. */
const Says = (() => {
  const live = new Map();    // cid -> { el, find, until }
  let raf = 0;
  function visible(el) {
    if (!el || !el.isConnected) return null;
    const r = el.getBoundingClientRect();
    if (r.width < 2 || r.height < 2 || r.bottom < 0 || r.top > innerHeight || r.right < 0 || r.left > innerWidth) return null;
    const cs = getComputedStyle(el);
    if (cs.visibility === 'hidden' || cs.display === 'none' || +cs.opacity === 0) return null;
    return r;
  }
  function finder(m) {
    return () => (m.seat != null && document.getElementById('seat-' + m.seat)) ||
      document.querySelector(`.prow[data-cid="${String(m.cid).replace(/["\\]/g, '')}"]`);
  }
  function show(m) {
    if (!m || !m.text) return false;
    const find = finder(m);
    if (!visible(find())) return false;
    const old = live.get(m.cid);
    if (old) old.el.remove();
    const el = document.createElement('div');
    el.className = 'say';
    el.textContent = m.text;
    document.body.appendChild(el);
    live.set(m.cid, { el, find, until: performance.now() + Math.max(3600, Math.min(8000, 2200 + m.text.length * 60)) });
    if (!raf) raf = requestAnimationFrame(frame);
    return true;
  }
  function frame() {
    raf = 0;
    const t = performance.now();
    for (const [cid, b] of live) {
      if (t > b.until + 400) { b.el.remove(); live.delete(cid); continue; }
      if (t > b.until) b.el.classList.add('bye');
      const r = visible(b.find());
      if (!r) { b.el.style.visibility = 'hidden'; continue; }
      b.el.style.visibility = '';
      const w = b.el.offsetWidth, h = b.el.offsetHeight;
      let x = r.left + r.width / 2 - w / 2, y = r.top - h - 10, below = false;
      if (y < 8) { y = r.bottom + 10; below = true; }
      x = Math.max(8, Math.min(innerWidth - w - 8, x));
      b.el.classList.toggle('below', below);
      b.el.style.setProperty('--ax', Math.max(14, Math.min(w - 14, r.left + r.width / 2 - x)) + 'px');
      b.el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
    }
    if (live.size) raf = requestAnimationFrame(frame);
  }
  function clear() { for (const b of live.values()) b.el.remove(); live.clear(); }
  return { show, clear };
})();
window.Says = Says;

<script>

/* =====================================================================
   ROOM — everything the host runs: members, bots, kicks, join-back requests,
   chat, settings and the game loop. Every room is listed in Open rooms.
   Every player (the host too) only ever receives a personalised view, so
   hidden things (fleets, codes) stay hidden.
   ===================================================================== */
const Room = (() => {
  const E = window.GE;
  const BOT_NAMES = ['Vex', 'Mara', 'Dice', 'Jinx', 'Rook', 'Nova', 'Ash', 'Kilo', 'Zed', 'Echo', 'Pike', 'Sable'];
  const BOT_AV = ['m7', 'm19', 'm21', 'm2', 'm16', 'm15', 'm9', 'm6'];
  const BOT_COL = ['#7c8aa5', '#5fb3b3', '#c792ea', '#f78c6c', '#82aaff', '#c3e88d', '#ffcb6b', '#ff5370'];
  const MAX_SEATS = E.MAX_SEATS, MAX_MEMBERS = 16;
  let R = null, SELF = null, deliver = null, pushT = null, lastPush = 0, ticker = null, worker = null;

  const now = () => Date.now();
  const cleanName = n => (String(n || '').replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, 16)) || 'Player';
  const cleanAv = a => (typeof a === 'string' && a.length && a.length <= 12 ? a : 'm0');
  const cleanCol = c => (/^#[0-9a-f]{6}$/i.test(c || '') ? c : '#3e9bff');
  const players = () => R.members.filter(m => !m.spec);
  const seatOf = c => (R.G ? R.G.seats.findIndex(s => s.cid === c) : -1);
  const byLink = L => R.members.find(m => m.link === L);

  function open(prof, ids, deliverFn, onReady, onStatus) {
    deliver = deliverFn;
    SELF = { via: 'self', open: true, send: m => deliver(m) };
    R = {
      code: null, members: [], kicked: new Set(), requests: [], reqId: 1, phase: 'lobby', G: null, chat: [], msgId: 1,
      settings: E.defaultSettings(2), gameNo: 0, counted: false, lastVer: -1, rate: new Map(), listed: true,
    };
    R.banter = Banter.make(E.BANTER || 'cl', banterApi());
    R.members.push({ cid: ids.cid, dev: ids.dev, name: cleanName(prof.name), avatar: cleanAv(prof.avatar), color: cleanCol(prof.color), host: true, bot: false, link: SELF, conn: true, via: 'self', spec: false, wins: 0, games: 0 });
    Net.openRoom({ onOpen, onMsg, onClose }, st => { if (R) { R.routes = st; push(); } onStatus && onStatus(st); }).then(code => {
      R.code = code;
      sys('Your room is open and listed in Open rooms. Friends can join from the game\'s home page.');
      startLoop();
      onReady(code);
      push();
    });
  }
  function close() {
    stopLoop();
    if (R && R.banter) R.banter.stop();
    Net.announce(null);
    if (R) Net.closeRoom();
    R = null;
  }


  /* ------------------------- bot banter ------------------------- */
  function banterApi() {
    return {
      level: () => (R && R.settings && R.settings.botChat) || 'some',
      G: () => (R && R.phase === 'game' ? R.G : null),
      people: () => (R ? R.members.filter(m => m.bot || !m.spec).map(m => {
        const si = R.phase === 'game' ? seatOf(m.cid) : -1, s = si >= 0 ? R.G.seats[si] : null;
        const tableOver = s && R.G.tables[s.t] && R.G.tables[s.t].done;
        return { cid: m.cid, name: m.name, bot: !!m.bot, seat: si, alive: s ? !!s.alive && !tableOver : R.phase !== 'game' };
      }) : []),
      say: (cid, text) => {
        if (!R) return;
        const m = R.members.find(x => x.cid === cid && x.bot);
        if (!m) return;
        const si = R.phase === 'game' ? seatOf(cid) : -1;
        chatPush({ id: R.msgId++, cid, name: m.name, avatar: m.avatar, color: m.color, text, ts: now(), bot: true, seat: si >= 0 ? si : null });
      },
    };
  }

  /* ------------------------- clock ------------------------- */
  function startLoop() {
    stopLoop();
    try {
      const src = 'let t=setInterval(()=>postMessage(0),100);onmessage=e=>{if(e.data==="stop")clearInterval(t)}';
      worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
      worker.onmessage = loop;     // worker timers keep running when the host's tab is in the background
    } catch (e) { worker = null; }
    ticker = setInterval(loop, worker ? 1000 : 100);
  }
  function stopLoop() { clearInterval(ticker); if (worker) { try { worker.postMessage('stop'); worker.terminate(); } catch (e) { /* */ } worker = null; } }
  function loop() {
    if (!R) return;
    const t = now();
    if (R.G && R.phase === 'game') {
      E.tick(R.G, t);
      drain();
      if (R.G.phase === 'over' && !R.counted) {
        R.counted = true;
        for (const s of R.G.seats) {
          const m = R.members.find(x => x.cid === s.cid);
          if (m && s.why !== 'sitout') { m.games++; if (R.G.winners.indexOf(s.i) >= 0) m.wins++; }
        }
        push();
      }
      if (R.G.ver !== R.lastVer) push();
      if (R.banter) R.banter.tick();
    }
    if (R.phase === 'lobby') {
      let changed = false;
      R.members = R.members.filter(m => {
        if (!m.bot && !m.host && !m.conn && t - (m.goneAt || t) > 25000) { sys(`${m.name} left.`); changed = true; return false; }
        return true;
      });
      if (changed) { autoNumbers(); push(); }
    }
  }

  /* ------------------------- sending ------------------------- */
  function send(m, msg) { if (m && m.link && m.conn) m.link.send(msg); }
  function all(msg) { for (const m of R.members) send(m, msg); }
  function push() {
    if (!R || pushT) return;
    const wait = Math.max(0, 60 - (now() - lastPush));
    pushT = setTimeout(flush, wait);
  }
  function flush() {
    pushT = null;
    if (!R) return;
    lastPush = now();
    if (R.G) R.lastVer = R.G.ver;
    for (const m of R.members) if (m.link && m.conn) m.link.send(stateFor(m));
    listing();
  }
  // the server browser: listed rooms show up on everyone's home page
  function listing() {
    if (!R || !R.code) return;
    if (!R.listed) { Net.announce(null); return; }
    const host = R.members.find(m => m.host) || {};
    Net.announce({ code: R.code, host: host.name, av: host.avatar, n: players().length, specs: R.members.filter(m => m.spec).length, bots: R.members.filter(m => m.bot).length, phase: R.phase, v: +E.VERSION || 0 });
  }
  function stateFor(m) {
    const st = {
      t: 'state', code: R.code, you: m.cid, phase: R.phase, settings: R.settings, gameNo: R.gameNo, routes: R.routes || {}, listed: R.listed, hv: E.VERSION,
      members: R.members.map(x => ({ cid: x.cid, name: x.name, avatar: x.avatar, color: x.color, bot: x.bot, host: x.host, conn: x.conn, via: x.via, spec: x.spec, wins: x.wins, games: x.games })),
      game: null,
    };
    if (m.host) st.req = R.requests.map(r => ({ id: r.id, name: r.prof.name, avatar: r.prof.avatar, color: r.prof.color, why: r.why }));
    if (R.G && R.phase === 'game') {
      st.game = E.viewFor(R.G, seatOf(m.cid), m.watch);
      if (m.via === 'relay') st.game.log = st.game.log.slice(-25);
    }
    return st;
  }
  function drain() {
    const G = R.G;
    if (!G || !G.out.length) return;
    const out = G.out.splice(0);
    for (const o of out) {
      if (o.to === -1) { all({ t: 'ev', e: o.m }); if (R.banter && o.m && o.m.t === 'fx') R.banter.fx(o.m); }
      else {
        const s = G.seats[o.to];
        if (s && !s.bot) send(R.members.find(x => x.cid === s.cid), { t: 'ev', e: o.m });
      }
    }
  }
  function sys(text) { chatPush({ id: R.msgId++, sys: true, text, ts: now() }); }
  function chatPush(msg) { R.chat.push(msg); if (R.chat.length > 80) R.chat.splice(0, R.chat.length - 80); all({ t: 'chat', m: msg }); }
  function toastTo(m, text, kind) { send(m, { t: 'toast', text, kind }); }

  /* ------------------------- links ------------------------- */
  function onOpen(L) { L.helloBy = now() + 15000; setTimeout(() => { if (L.open && !L.cid) L.close(); }, 16000); }
  function onClose(L) {
    if (!R) return;
    const before = R.requests.length;
    R.requests = R.requests.filter(r => r.L !== L);
    const m = byLink(L);
    if (m) {
      m.conn = false; m.link = null; m.goneAt = now();
      const si = seatOf(m.cid);
      if (R.phase === 'game' && si >= 0 && R.G.seats[si].alive && R.G.phase !== 'over') {
        E.setConnected(R.G, si, false);
        sys(`${m.name} lost connection. Moves are made for them until they're back.`);
      } else sys(`${m.name} disconnected.`);
    }
    if (m || R.requests.length !== before) push();
  }
  function onMsg(L, m) {
    if (!R) return;
    if (m.t === 'hello') return hello(L, m);
    const mem = byLink(L);
    if (!mem) return;
    switch (m.t) {
      case 'chat': chat(mem, m.text); break;
      case 'act': act(mem, m.x); break;
      case 'profile': profile(mem, m); break;
      case 'leave': leave(mem, 'left'); break;
      case 'watch': mem.watch = Math.max(0, Math.min(7, Math.round(+m.tb) || 0)); push(); break;
    }
    // incoming traffic also drives the clock if the host's timers get throttled
    if (R && R.G && R.phase === 'game') loop();
  }

  function hello(L, m) {
    if (L.cid) return;
    const p = { name: cleanName(m.name), avatar: cleanAv(m.avatar), color: cleanCol(m.color) };
    const c = String(m.cid || '').slice(0, 40), dev = String(m.dev || '').slice(0, 40);
    if (!c) return L.close();
    L.cid = c;
    if (R.kicked.has(c) || (dev && R.kicked.has('dev:' + dev))) return request(L, c, dev, p, 'kicked');
    let mem = R.members.find(x => !x.bot && x.cid === c);
    if (mem) {
      if (mem.host) return L.close();
      attach(mem, L, p);
      sys(`${mem.name} is back.`);
      return;
    }
    if (R.phase === 'game' && R.G && R.G.phase !== 'over') {
      // a seat counts as yours if it's away and has your device or name, or if it still looks
      // connected but has your device AND name: a killed tab or dropped wifi takes a few
      // seconds to notice, and reopening right away shouldn't turn you into a spectator
      const same = x => x.name.toLowerCase() === p.name.toLowerCase();
      const away = R.members.find(x => !x.bot && !x.host && !x.spec &&
        (x.conn ? (dev && x.dev === dev && same(x)) : ((dev && x.dev === dev) || same(x))) &&
        seatOf(x.cid) >= 0 && R.G.seats[seatOf(x.cid)].alive);
      if (away) return request(L, c, dev, p, 'reclaim', away.cid);
    }
    if (R.members.length >= MAX_MEMBERS) { L.send({ t: 'denied', why: 'full' }); setTimeout(() => L.close(), 300); return; }
    const spec = R.phase === 'game' || players().length >= MAX_SEATS;
    mem = { cid: c, dev, name: p.name, avatar: p.avatar, color: p.color, host: false, bot: false, link: L, conn: true, via: L.via, spec, wins: 0, games: 0 };
    R.members.push(mem);
    welcome(mem);
    sys(`${mem.name} joined${spec ? (R.phase === 'game' ? ' and is watching (they play next game)' : ' as a spectator (table is full)') : ''}.`);
    autoNumbers();
    push();
  }
  function attach(mem, L, p) {
    if (mem.link && mem.link !== L && mem.link.open) { try { mem.link.send({ t: 'replaced' }); mem.link.close(); } catch (e) { /* */ } }
    mem.link = L; mem.conn = true; mem.via = L.via; L.cid = mem.cid;
    if (p) { mem.avatar = p.avatar; mem.color = p.color; }
    const si = seatOf(mem.cid);
    if (si >= 0) E.setConnected(R.G, si, true);
    welcome(mem);
    push();
  }
  function welcome(mem) {
    send(mem, { t: 'welcome', code: R.code, you: mem.cid, chat: R.chat.slice(-50) });
    send(mem, stateFor(mem));
  }
  function request(L, c, dev, p, why, seatCid) {
    R.requests = R.requests.filter(r => r.cid !== c);
    R.requests.push({ id: R.reqId++, L, cid: c, dev, prof: p, why, seatCid, at: now() });
    L.send({ t: 'wait', why });
    const host = R.members.find(m => m.host);
    toastTo(host, why === 'kicked' ? `${p.name} (removed earlier) wants to join back.` : `${p.name} wants to take their seat back.`, 'req');
    push();
  }

  /* ------------------------- player messages ------------------------- */
  function chat(mem, text) {
    text = String(text || '').replace(/[\u0000-\u001f]/g, ' ').trim().slice(0, 200);
    if (!text) return;
    const t = now(), r = (R.rate.get(mem.cid) || []).filter(x => t - x < 5000);
    if (r.length >= 6) { toastTo(mem, 'Slow down a little', 'err'); return; }
    r.push(t); R.rate.set(mem.cid, r);
    chatPush({ id: R.msgId++, cid: mem.cid, name: mem.name, avatar: mem.avatar, color: mem.color, text, ts: t });
    if (R.banter && !mem.bot) R.banter.heard(mem.name, text);
  }
  function act(mem, x) {
    if (!R.G || R.phase !== 'game' || !x || typeof x !== 'object') return;
    const si = seatOf(mem.cid);
    if (si < 0) return toastTo(mem, "You're watching this game.", 'err');
    const err = E.act(R.G, si, E.cleanAction(x));
    if (err) toastTo(mem, err, 'err');
    drain();
    push();
  }
  function profile(mem, m) {
    const p = { name: cleanName(m.name), avatar: cleanAv(m.avatar), color: cleanCol(m.color) };
    if (p.name !== mem.name) sys(`${mem.name} is now ${p.name}.`);
    Object.assign(mem, p);
    const si = seatOf(mem.cid);
    if (si >= 0) { Object.assign(R.G.seats[si], p); R.G.ver++; }
    push();
  }
  function leave(mem, why) {
    const si = seatOf(mem.cid);
    if (R.phase === 'game' && si >= 0) { E.removeSeat(R.G, si, why); drain(); }
    R.members = R.members.filter(x => x !== mem);
    if (why === 'kicked') {
      R.kicked.add(mem.cid);
      if (mem.dev) R.kicked.add('dev:' + mem.dev);
      if (mem.link) { mem.link.send({ t: 'kicked' }); const L = mem.link; setTimeout(() => L.close(), 400); }
      sys(`${mem.name} was removed by the host.`);
    } else {
      if (mem.link) { const L = mem.link; setTimeout(() => L.close(), 200); }
      sys(`${mem.name} left the room.`);
    }
    mem.link = null;
    autoNumbers();
    push();
  }

  /* ------------------------- host commands ------------------------- */
  function autoNumbers() { if (R.settings.auto && R.phase === 'lobby') R.settings = E.cleanSettings(R.settings, Math.max(2, players().length)); }
  const cmd = {
    fromSelf(m) { onMsg(SELF, m); },
    kick(c) {
      const m = R.members.find(x => x.cid === c);
      if (!m || m.host) return;
      if (m.bot) return cmd.removeBot(c);
      leave(m, 'kicked');
    },
    addBot() {
      if (players().length >= MAX_SEATS) return false;
      const used = new Set(R.members.map(m => m.name));
      const name = (BOT_NAMES.find(n => !used.has('Bot ' + n)) || 'X' + R.members.length);
      const k = R.members.filter(m => m.bot).length;
      const spec = R.phase === 'game';
      R.members.push({ cid: 'bot-' + Math.random().toString(36).slice(2, 8), name: 'Bot ' + name, avatar: BOT_AV[k % BOT_AV.length], color: BOT_COL[k % BOT_COL.length], bot: true, host: false, link: null, conn: true, via: 'bot', spec, wins: 0, games: 0 });
      if (R.banter) R.banter.joined(R.members[R.members.length - 1].cid);
      autoNumbers(); push();
      return true;
    },
    removeBot(c) {
      const m = R.members.find(x => x.cid === c && x.bot);
      if (!m) return;
      const si = seatOf(c);
      if (R.phase === 'game' && si >= 0) { E.removeSeat(R.G, si, 'kicked'); drain(); }
      R.members = R.members.filter(x => x !== m);
      autoNumbers(); push();
    },
    setListed(v) { R.listed = !!v; push(); },
    settings(patch) {
      if (R.phase !== 'lobby') return;
      const s = Object.assign({}, R.settings, patch);
      R.settings = E.cleanSettings(s, Math.max(2, players().length));
      push();
    },
    start() {
      let ps = players().slice(0, MAX_SEATS);
      if (ps.length < 2) return 'You need at least 2 players. Add a bot!';
      // 2-player games: an odd player out gets a bot opponent at their own table
      if (E.PAIRS && ps.length % 2 && ps.length < MAX_SEATS && cmd.addBot()) {
        const b = R.members[R.members.length - 1];
        sys(`${b.name} joins so everyone has an opponent.`);
        ps = players().slice(0, MAX_SEATS);
      }
      R.settings = E.cleanSettings(R.settings, ps.length);
      R.G = E.newGame(ps.map(m => ({ cid: m.cid, name: m.name, avatar: m.avatar, color: m.color, bot: m.bot })), R.settings, null, now());
      for (const m of ps) if (!m.bot && !m.conn) E.setConnected(R.G, seatOf(m.cid), false);
      R.phase = 'game'; R.counted = false; R.gameNo++;
      for (const m of R.members) m.watch = null;
      if (R.banter) R.banter.start();
      drain(); push();
      return null;
    },
    endGame() { if (R.G && R.G.phase !== 'over') { E.endGame(R.G); sys('The host ended the game.'); drain(); push(); } },
    toLobby() {
      R.phase = 'lobby'; R.G = null;
      for (const m of R.members) if (m.spec && players().length < MAX_SEATS) m.spec = false;
      autoNumbers(); push();
    },
    again() {
      for (const m of R.members) if (m.spec && players().length < MAX_SEATS) m.spec = false;
      R.phase = 'lobby';
      autoNumbers();
      return cmd.start();
    },
    accept(id) {
      const r = R.requests.find(x => x.id === id);
      if (!r) return;
      R.requests = R.requests.filter(x => x !== r);
      if (!r.L.open) return push();
      if (r.why === 'kicked') {
        R.kicked.delete(r.cid); if (r.dev) R.kicked.delete('dev:' + r.dev);
        r.L.cid = null;
        hello(r.L, { cid: r.cid, dev: r.dev, name: r.prof.name, avatar: r.prof.avatar, color: r.prof.color });
      } else {
        const mem = R.members.find(x => x.cid === r.seatCid);
        if (!mem) { r.L.cid = null; return hello(r.L, { cid: r.cid, dev: r.dev, name: r.prof.name, avatar: r.prof.avatar, color: r.prof.color }); }
        const si = seatOf(mem.cid);
        mem.cid = r.cid; mem.dev = r.dev || mem.dev;
        if (si >= 0) R.G.seats[si].cid = r.cid;
        attach(mem, r.L, r.prof);
        sys(`${mem.name} took their seat back.`);
      }
      push();
    },
    deny(id) {
      const r = R.requests.find(x => x.id === id);
      if (!r) return;
      R.requests = R.requests.filter(x => x !== r);
      r.L.send({ t: 'denied', why: r.why });
      setTimeout(() => r.L.close(), 400);
      push();
    },
    closeRoom() { if (R) { all({ t: 'closed' }); } close(); },
  };

  return { open, close, cmd, isOpen: () => !!R, code: () => R && R.code, _R: () => R };
})();

<script>

/* Version tag: when this copy was built, in your own time zone, shown on the home screen
   and in the menu, so you can tell whether the newest push has reached you yet.
   build.py stamps 202611280352 (UTC, YYYYMMDDHHMM) and flip-version.json (the version file that
   sits next to the page on the site). Every couple of minutes it checks that file and
   offers a reload when a newer version is live. */
const BuildVer = (() => {
  const B = '202611280352', FILE = 'flip-version.json';
  const parse = b => { const m = /^(\d{4})(\d\d)(\d\d)(\d\d)(\d\d)$/.exec(String(b || '')); return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5])) : null; };
  const fmt = d => d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const mine = parse(B);
  let newer = null;
  const label = () => mine ? 'Version ' + fmt(mine) : 'Version: test build';
  const newHTML = () => newer ? ` · <button type="button" class="vnew" onclick="location.reload()">${fmt(newer)} is out: reload</button>` : '';
  function paint() {
    const el = document.getElementById('verTag');
    if (!el) return;
    el.title = 'Build ' + B;
    el.innerHTML = label() + newHTML();
    for (const m of document.querySelectorAll('.mver')) m.innerHTML = label() + newHTML();
  }
  function check() {
    if (!/^https?:$/.test(location.protocol) || !mine || !window.fetch || document.hidden) return;
    fetch(FILE + '?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(j => {
      const d = j && parse(j.v);
      if (d && d > mine && (!newer || d > newer)) { newer = d; paint(); }
    }).catch(() => { /* offline or a downloaded copy: just show the label */ });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', paint); else paint();
  setTimeout(check, 2500);
  setInterval(check, 120000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
  return { B, label, html: () => `<div class="mver" title="Build ${B}">${label()}${newHTML()}</div>` };
})();
window.BuildVer = BuildVer;


</script>
