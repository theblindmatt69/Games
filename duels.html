<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Duel Arcade · two players, one screen</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='6' y='6' width='88' height='88' rx='22' fill='%2309090c'/><circle cx='50' cy='50' r='26' fill='%23ff6bd6'/><circle cx='42' cy='41' r='8' fill='white' opacity='.45'/></svg>">
<style>
:root{--bg:#07070c;--panel:#12121c;--line:#262638;--text:#f2f2f8;--muted:#9a9ab4;--blue:#3ea6ff;--red:#ff4d5e;--gold:#ffd54a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
kbd{display:inline-block;min-width:22px;padding:1px 6px;margin:0 1px;border-radius:6px;border:1px solid #3a3a52;border-bottom-width:2px;background:#191926;font:700 12px/1.6 ui-monospace,Menlo,monospace;color:#dcdcf0}

/* menu */
#menu{min-height:100%;padding:0 16px 60px;background:radial-gradient(900px 500px at 15% -10%,rgba(62,166,255,.16),transparent 60%),radial-gradient(900px 500px at 85% -10%,rgba(255,77,94,.16),transparent 60%),var(--bg)}
.mtop{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto;padding:16px 0}
.back{color:var(--muted);text-decoration:none;font-size:20px;width:36px;height:36px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line)}
.brand{font-weight:900;letter-spacing:.14em;font-size:20px}
.brand b{background:linear-gradient(90deg,var(--blue),var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:18px;margin-left:auto}
.lead{max-width:1100px;margin:0 auto 8px;color:var(--muted);line-height:1.7}
.k1{color:var(--blue)}.k2{color:var(--red)}
#menuList{max-width:1100px;margin:0 auto}
#menuList h2{font-size:17px;letter-spacing:.04em;margin:26px 0 10px;color:#dcdcf0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tile{--c:#888;display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:18px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,var(--panel)),var(--panel));border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));color:inherit;text-decoration:none;transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-2px);box-shadow:0 10px 30px color-mix(in srgb,var(--c) 25%,transparent)}
.tile .ti{font-size:34px;line-height:1.1}
.tile b{font-size:16px}
.tile small{color:var(--muted);font-size:12.5px;line-height:1.4}

/* playing */
#arcade{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;display:block;touch-action:none}
#pauseBtn{position:absolute;left:8px;top:50%;translate:0 -50%;margin:0;opacity:.75;z-index:3;width:38px;height:38px}
@media (orientation:landscape){#pauseBtn{left:50%;top:8px;translate:-50% 0}}
.pill{position:absolute;left:50%;bottom:16px;translate:-50% 0;padding:9px 18px;border-radius:99px;border:1px solid #3a3a52;background:rgba(18,18,28,.85);font-weight:800;font-size:14px;z-index:3}
@media (orientation:portrait){.pill{bottom:auto;top:50%;left:auto;right:10px;translate:0 -50%}}
@media (pointer:coarse){.pill{display:none}}
#pausebox,#overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(4,4,8,.55);backdrop-filter:blur(3px);z-index:5}
.box{display:flex;flex-direction:column;gap:10px;align-items:stretch;width:min(300px,86vw);padding:22px;border-radius:20px;background:#151522;border:1px solid #33334a;box-shadow:0 30px 80px rgba(0,0,0,.6);text-align:center}
.box h2{margin:0 0 4px}
.who{font-size:30px;font-weight:900}
.sc{font-size:20px;font-weight:800;color:var(--muted);margin-bottom:6px}
.btn{padding:12px 16px;border-radius:13px;border:1px solid #3a3a52;background:#1d1d2c;font-weight:800;font-size:16px}
.btn.gold{background:linear-gradient(180deg,#ffd54a,#e8a817);color:#2a1d00;border-color:#b88300}
.btn.small{align-self:center;width:52px;padding:8px}

.vertag{position:fixed;left:10px;bottom:8px;font-size:11px;color:rgba(255,255,255,.4)}
.vertag .vnew,.mver .vnew{font:inherit;font-weight:700;color:var(--gold);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
@media(max-width:760px){.vertag{position:static;text-align:center;padding:24px 0 6px}}


.tile .ti svg{width:1em;height:1em;display:block}
.ib .ic,.btn .ic{width:19px;height:19px;display:block;margin:auto}

/* ================= Matt's Game Room look (same as Wall Go II) ================= */
:root{--bg:#09090c;--bg2:#0f0f14;--panel:#121218;--panel2:#1c1c25;--line:#262630;--line2:#33333f;--text:#eeedf2;--muted:#a3a2af;--dim:#6d6c7a;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{background:radial-gradient(1100px 700px at 30% 0%,#181820 0,transparent 62%) no-repeat,var(--bg)}
#topbar{background:rgba(9,9,12,.86);backdrop-filter:blur(6px)}
.btn{border-radius:10px;background:#1c1c25;border-color:var(--line);font-weight:600}
.btn:hover{background:#242430;border-color:var(--line2)}
.btn.primary{background:#eeedf2;border-color:#eeedf2;color:#0b0b0f;box-shadow:none}
.btn.primary:hover{background:#fff}
.btn.primary[disabled]{background:#3a3a46;border-color:#3a3a46;color:#a3a2af}
.icon-btn{border-radius:10px;background:var(--panel);border-color:var(--line);color:var(--text)}
.icon-btn .ic,.btn .ic{width:19px;height:19px;display:block}
.home-card,.mbox,.endbox,.panel,.card{background:linear-gradient(180deg,#17171f,#0f0f14)}
.field,input.field,select.field{background:#0b0b0f;border-color:var(--line)}
.field:focus{border-color:#eeedf2}
.avatar{background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--c,#3c8cff) 45%,#fff) 0,var(--c,#3c8cff) 42%,color-mix(in srgb,var(--c,#3c8cff) 60%,#000) 100%);
  box-shadow:0 2px 0 color-mix(in srgb,var(--c,#3c8cff) 40%,#000),0 5px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35);font-size:0;color:#fff}
.avatar .mk{width:56%;height:56%;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.picker button{display:grid;place-items:center;font-size:0;background:#1c1c25}
.picker button .mk{width:22px;height:22px}
.picker button .mk *{fill:#eeedf2}
.picker button .mk [stroke]{stroke:#eeedf2;fill:none}
.endbox .trophy{font-size:0;line-height:0;display:grid;place-items:center}
.endbox .trophy .big-ic{width:72px;height:72px}
</style>
</head>
<body>
<section id="menu">
  <header class="mtop">
    <a class="back" href="index.html" title="Back to the game room">←</a>
    <div class="brand">DUEL <b>ARCADE</b></div>
    <button class="ib" data-act="sound" title="Sound"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M4 9h3.5L12 5v14l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  </header>
  <p class="lead">Two players, one screen. Share a phone or tablet (each of you takes a half), or a keyboard: <b class="k1">Blue</b> uses <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> + <kbd>Space</kbd>, <b class="k2">Red</b> uses the <kbd>arrow keys</kbd> + <kbd>Enter</kbd>.</p>
  <div id="menuList"></div>
  <div class="vertag" id="verTag"></div>
</section>
<section id="arcade" class="hidden">
  <canvas id="cv"></canvas>
  <button id="pauseBtn" class="ib" data-act="pause" title="Pause (Esc)"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><rect x="6.5" y="5" width="3.6" height="14" rx="1.2" fill="currentColor"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.2" fill="currentColor"/></svg></button>
  <button id="startNow" class="pill" data-act="startnow">▶ Start</button>
  <div id="pausebox" class="hidden"><div class="box"><h2>Paused</h2>
    <button class="btn gold" data-act="resume">Resume</button>
    <button class="btn" data-act="restart">Restart</button>
    <button class="btn" data-act="menu">All games</button>
    <button class="btn small" data-act="sound"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M4 9h3.5L12 5v14l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  </div></div>
  <div id="overlay" class="hidden"><div class="box"><div class="who"></div><div class="sc"></div>
    <button class="btn gold" data-act="again">Rematch</button>
    <button class="btn" data-act="menu">All games</button>
  </div></div>
</section>
<script>
/* ============================================================================
   Duel Arcade core: two players on one screen.

   Every game is written in one "world": 1000 wide by 1600 tall, Blue (player 0)
   at the bottom and Red (player 1) at the top. On a tall screen it's shown as is
   and Red's text is flipped to face them across the table. On a wide screen the
   world is turned so Blue is on the left and Red on the right.
   Board games can ask not to be turned and lay themselves out instead.

   Controls: touch your own half of the screen. On a keyboard Blue uses
   W A S D (plus Space, Q, E...) and Red uses the arrow keys (plus Enter...).
   ========================================================================== */
const Duel = (() => {
  const PL = [
    { name: 'Blue', c: '#3ea6ff', c2: '#1d5ea3', soft: 'rgba(62,166,255,.18)', glow: 'rgba(62,166,255,.7)' },
    { name: 'Red', c: '#ff4d5e', c2: '#a51f2f', soft: 'rgba(255,77,94,.18)', glow: 'rgba(255,77,94,.7)' },
  ];
  const FONT = 'Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const GAMES = [];
  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  let cv, g, W = 0, H = 0, DPR = 1;
  let G = null, raf = 0, last = 0;
  const coarse = () => matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window && navigator.maxTouchPoints > 0);
  let touchSeen = false;

  /* -------------------------------- sound -------------------------------- */
  const Snd = (() => {
    let ctx = null, on = true;
    try { on = localStorage.getItem('duels-sound') !== 'off'; } catch (e) {}
    function ac() {
      if (!on) return null;
      if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }
    function tone(f, d, type, vol, at, f2) {
      const c = ac(); if (!c) return;
      const t = c.currentTime + (at || 0), o = c.createOscillator(), gn = c.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
      gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol || 0.1, t + 0.006); gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(gn).connect(c.destination); o.start(t); o.stop(t + d + 0.03);
    }
    function noise(d, f, vol) {
      const c = ac(); if (!c) return;
      const n = Math.floor(c.sampleRate * d), b = c.createBuffer(1, n, c.sampleRate), ch = b.getChannelData(0);
      for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
      const s = c.createBufferSource(), fl = c.createBiquadFilter(), gn = c.createGain();
      fl.type = 'lowpass'; fl.frequency.value = f || 1200; gn.gain.value = vol || 0.3;
      s.buffer = b; s.connect(fl).connect(gn).connect(c.destination); s.start();
    }
    const last = {};
    const S = {
      tap: () => tone(660, 0.06, 'triangle', 0.07),
      hit: () => tone(320, 0.08, 'square', 0.06, 0, 180),
      wall: () => tone(200, 0.05, 'triangle', 0.05),
      score: () => { tone(523, 0.12, 'triangle', 0.09); tone(784, 0.18, 'triangle', 0.09, 0.09); },
      win: () => [523, 659, 784, 1047].forEach((f, k) => tone(f, 0.22, 'triangle', 0.09, k * 0.11)),
      tick: () => tone(880, 0.05, 'sine', 0.06),
      go: () => tone(1175, 0.18, 'square', 0.06),
      bad: () => tone(160, 0.25, 'sawtooth', 0.06, 0, 90),
      boom: () => noise(0.35, 900, 0.45),
      shot: () => noise(0.08, 3000, 0.2),
      pick: () => tone(990, 0.05, 'sine', 0.06),
      paint: () => tone(rnd(500, 700), 0.03, 'sine', 0.02),
    };
    return {
      play(n) { const t = performance.now(); if (last[n] && t - last[n] < 35) return; last[n] = t; if (S[n]) S[n](); },
      get on() { return on; },
      toggle() { on = !on; try { localStorage.setItem('duels-sound', on ? 'on' : 'off'); } catch (e) {} if (on) S.tap(); return on; },
    };
  })();

  /* ----------------------------- world and screen ----------------------------- */
  const V = { s: 1, cx: 0, cy: 0, rot: 0, ww: 1000, wh: 1600, portrait: true };
  function worldSize(gm) {
    const portrait = H >= W;
    if (gm && typeof gm.world === 'function') return gm.world(portrait);
    return (gm && gm.world) || { w: 1000, h: 1600 };
  }
  function layout() {
    W = innerWidth; H = innerHeight; DPR = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    if (!G) return;
    const gm = G.game, ws = worldSize(gm);
    V.portrait = H >= W;
    V.rot = gm.rotate !== false && !V.portrait ? 1 : 0;
    V.ww = ws.w; V.wh = ws.h;
    const sw = V.rot ? ws.h : ws.w, sh = V.rot ? ws.w : ws.h;
    V.s = Math.min(W / sw, H / sh);
    V.cx = W / 2; V.cy = H / 2;
    G.w = ws.w; G.h = ws.h; G.portrait = V.portrait; G.rot = V.rot;
    G.face = touchSeen || coarse();
    if (gm.resize) gm.resize(G);
  }
  function toWorld(sx, sy) {
    let dx, dy;
    if (V.rot) { dx = (sy - V.cy) / V.s; dy = -(sx - V.cx) / V.s; } else { dx = (sx - V.cx) / V.s; dy = (sy - V.cy) / V.s; }
    return [dx + V.ww / 2, dy + V.wh / 2];
  }
  function worldTransform(ox, oy) {
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.translate(V.cx + (ox || 0), V.cy + (oy || 0));
    if (V.rot) g.rotate(Math.PI / 2);
    g.scale(V.s, V.s);
    g.translate(-V.ww / 2, -V.wh / 2);
  }
  // which way text should face for a player: toward them on touch screens, upright on a computer
  function upright() { return V.rot ? -Math.PI / 2 : 0; }
  function faceAng(p) {
    if (!G.face) return upright();
    if (G.game.rotate === false && !V.portrait) return p === 0 ? Math.PI / 2 : -Math.PI / 2;
    return p === 0 ? 0 : Math.PI;
  }
  // a player's half of the world
  function zone(p) {
    const w = G.w, h = G.h;
    if (G.game.rotate === false && !V.portrait) return p === 0 ? { x: 0, y: 0, w: w / 2, h } : { x: w / 2, y: 0, w: w / 2, h };
    return p === 0 ? { x: 0, y: h / 2, w, h: h / 2 } : { x: 0, y: 0, w, h: h / 2 };
  }
  function owner(x, y) {
    if (G.game.owner) return G.game.owner(G, x, y);
    if (G.game.rotate === false && !V.portrait) return x < G.w / 2 ? 0 : 1;
    return y >= G.h / 2 ? 0 : 1;
  }


  /* --------------------------------- sprites (drawn, no emojis) ---------------------------------
     Each sprite is a list of path layers in a 24×24 box: {d, f: fill, s: stroke, w: width}. 'C' = the colour asked for. */
  const ci = (x, y, r) => `M${x - r} ${y}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0z`;
  const star = (n, cx, cy, R, r) => { let d = ''; for (let k = 0; k < n * 2; k++) { const a = -Math.PI / 2 + k * Math.PI / n, q = k % 2 ? r : R; d += (k ? 'L' : 'M') + (cx + Math.cos(a) * q).toFixed(2) + ' ' + (cy + Math.sin(a) * q).toFixed(2); } return d + 'z'; };
  const poly = (n, cx, cy, R, rot) => { let d = ''; for (let k = 0; k < n; k++) { const a = (rot || 0) + k * 2 * Math.PI / n; d += (k ? 'L' : 'M') + (cx + Math.cos(a) * R).toFixed(2) + ' ' + (cy + Math.sin(a) * R).toFixed(2); } return d + 'z'; };
  const FACE = '#ffd25a', INK = '#2a1a0a';
  const SPR = {
    circle: [{ d: ci(12, 12, 8.5), f: '#ff6b6b' }], ring: [{ d: ci(12, 12, 7.5), s: '#ff6b6b', w: 3 }],
    square: [{ d: 'M4 4h16v16H4z', f: '#3ea6ff' }], squareR: [{ d: 'M8 4h8a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4z', f: '#3ea6ff' }],
    star5: [{ d: star(5, 12, 12.6, 10, 4.2), f: '#ffd54a' }], star6: [{ d: star(6, 12, 12, 10, 5), f: '#ffd54a' }],
    triUp: [{ d: 'M12 3l9.5 17h-19z', f: '#3ddc84' }], triDown: [{ d: 'M12 21L2.5 4h19z', f: '#3ddc84' }],
    hex: [{ d: poly(6, 12, 12, 9.5, Math.PI / 6), f: '#b56bff' }], oct: [{ d: poly(8, 12, 12, 9.5, Math.PI / 8), f: '#b56bff' }],
    plus: [{ d: 'M9.5 3h5v6.5H21v5h-6.5V21h-5v-6.5H3v-5h6.5z', f: '#ff9f43' }], cross: [{ d: 'M5.6 2.1L12 8.5l6.4-6.4 3.5 3.5L15.5 12l6.4 6.4-3.5 3.5L12 15.5l-6.4 6.4-3.5-3.5L8.5 12 2.1 5.6z', f: '#ff9f43' }],
    heart: [{ d: 'M12 21s-9-5.5-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.5-9 12-9 12z', f: '#ff6bd6' }], drop: [{ d: 'M12 2.5s7 8 7 12.5a7 7 0 0 1-14 0C5 10.5 12 2.5 12 2.5z', f: '#ff6bd6' }],
    moon: [{ d: 'M15.5 2.5a9.5 9.5 0 1 0 6 16.5A8 8 0 0 1 15.5 2.5z', f: '#9bd1ff' }], sun: [{ d: ci(12, 12, 5.5), f: '#9bd1ff' }, { d: 'M12 1.5v3.5M12 19v3.5M1.5 12H5M19 12h3.5M4.6 4.6l2.5 2.5M16.9 16.9l2.5 2.5M4.6 19.4l2.5-2.5M16.9 7.1l2.5-2.5', s: '#9bd1ff', w: 2.2 }],
    bolt: [{ d: 'M14 1.5L4 13.5h6.5L9 22.5l10.5-13H13z', f: '#ffd54a' }], boltL: [{ d: 'M10 1.5l10 12h-6.5l1.5 9-10.5-13H11z', f: '#ffd54a' }],
    arrowUp: [{ d: 'M12 2.5l8.5 9H15v10h-6v-10H3.5z', f: '#5ad1c8' }], arrowR: [{ d: 'M21.5 12l-9 8.5V15h-10V9h10V3.5z', f: '#5ad1c8' }],
    star: [{ d: star(5, 12, 12.6, 10, 4.2), f: '#ffd54a' }],
    dotB: [{ d: ci(12, 12, 8), f: '#3ea6ff' }, { d: ci(9.5, 9.5, 2.5), f: 'rgba(255,255,255,.45)' }], dotR: [{ d: ci(12, 12, 8), f: '#ff4d5e' }, { d: ci(9.5, 9.5, 2.5), f: 'rgba(255,255,255,.45)' }],

      g.fillStyle = 'rgba(5,5,10,.5)'; g.fillRect(0, 0, G.w, G.h);
      if (G.face) {
        for (const p of [0, 1]) {
          const z = zone(p), won = p === G.winner;
          say(p, won ? 'YOU WIN!' : 'YOU LOSE', z.x + z.w / 2, z.y + z.h / 2, won ? 110 : 80, won ? PL[p].c : 'rgba(255,255,255,.7)', { glow: won ? PL[p].glow : 'transparent', w: 900 });
        }
      }
    }
  }

  /* ---------------------------------- menu ---------------------------------- */
  const CATS = [['action', 'Action'], ['reflex', 'Reflex & brain'], ['board', 'Board games']];
  function buildMenu() {
    $('menuList').innerHTML = CATS.map(([k, label]) => {
      const list = GAMES.filter(gm => gm.cat === k);
      return `<h2>${label}</h2><div class="grid">${list.map(gm => `<a class="tile" href="#${gm.id}" style="--c:${gm.color}"><span class="ti">${gm.icon}</span><b>${gm.name}</b><small>${gm.blurb}</small></a>`).join('')}</div>`;
    }).join('');
  }
  function route() {
    const id = location.hash.replace('#', '');
    const gm = GAMES.find(x => x.id === id);
    if (gm) open(gm); else showMenu();
  }
  function open(gm) {
    $('menu').classList.add('hidden');
    $('arcade').classList.remove('hidden');
    $('pausebox').classList.add('hidden');
    document.title = `${gm.name} · Duel Arcade`;
    newMatch(gm);
    last = performance.now();
    if (!raf) raf = requestAnimationFrame(frame);
  }
  function showMenu() {
    G = null;
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    $('arcade').classList.add('hidden');
    $('menu').classList.remove('hidden');
    document.title = 'Duel Arcade · two players, one screen';
  }
  function start() {
    cv = $('cv'); g = cv.getContext('2d');
    buildMenu();
    addEventListener('resize', layout);
    addEventListener('keydown', e => onKey(e, true));
    addEventListener('keyup', e => onKey(e, false));
    addEventListener('blur', () => { if (G) for (const I of G.inp) { I.keys.clear(); I.k = { u: 0, d: 0, l: 0, r: 0 }; I.down = false; } });
    cv.addEventListener('pointerdown', onDown);
    cv.addEventListener('pointermove', onMove);
    cv.addEventListener('pointerup', onUp);
    cv.addEventListener('pointercancel', onUp);
    cv.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('click', e => {
      const a = e.target.closest('[data-act]');
      if (!a) return;
      const act = a.dataset.act;
      if (act === 'pause') togglePause();
      else if (act === 'resume') togglePause();
      else if (act === 'restart' || act === 'again') { $('pausebox').classList.add('hidden'); open(G.game); }
      else if (act === 'menu') { location.hash = ''; showMenu(); }
      else if (act === 'startnow' && G && G.state === 'ready') { G.ready = [true, true]; Snd.play('tap'); }
      else if (act === 'sound') { const on = Snd.toggle(); for (const b of document.querySelectorAll('[data-act=sound]')) b.innerHTML = on ? '<svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M4 9h3.5L12 5v14l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>' : '<svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M4 9h3.5L12 5v14l-4.5-4H4z" fill="currentColor"/><path d="M16 9.5l5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'; }
    });
    for (const b of document.querySelectorAll('[data-act=sound]')) b.innerHTML = Snd.on ? '<svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M4 9h3.5L12 5v14l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>' : '<svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M4 9h3.5L12 5v14l-4.5-4H4z" fill="currentColor"/><path d="M16 9.5l5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
    addEventListener('hashchange', route);
    layout();
    route();
  }
  return { reg: gm => GAMES.push(gm), start, PL, GAMES, pick, rnd, clamp, get G() { return G; }, _v: V, toWorld };
})();
window.Duel = Duel;

<script>
/* Action games, part 1: Air Hockey, Ping Pong, Sumo */
(() => {
  const { PL } = Duel;
  const len = (x, y) => Math.hypot(x, y);

  /* ================================ AIR HOCKEY ================================ */
  const MR = 78, PR = 48, GOAL = 400;
  Duel.reg({
    id: 'airhockey', base: '#0a1420', name: 'Air Hockey', icon: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="15" r="5" fill="#36e0ff"/><circle cx="12" cy="15" r="2.2" fill="#0a1420"/><circle cx="12" cy="6" r="3" fill="#fff"/></svg>', color: '#36e0ff', cat: 'action', target: 7,
    blurb: 'Smash the puck into the other goal. First to 7.',
    how: { touch: 'Drag your mallet around your half.\nKnock the puck into the far goal.', keys: ['W A S D to move your mallet', 'Arrow keys to move your mallet'] },
    pause: 1.1, recount: false,
    init(G) { G.d.conceded = Math.random() < 0.5 ? 0 : 1; },
    newRound(G) {
      const d = G.d;
      d.m = [{ x: 500, y: 1380, vx: 0, vy: 0 }, { x: 500, y: 220, vx: 0, vy: 0 }];
      d.puck = { x: 500, y: d.conceded === 0 ? 1020 : 580, vx: 0, vy: 0 };
      d.trail = [];
    },
    update(G, dt) {
      const d = G.d, N = 4, h = dt / N;
      for (let s = 0; s < N; s++) {
        for (const p of [0, 1]) {
          const m = d.m[p], I = G.inp[p], ox = m.x, oy = m.y;
          if (I.ptr) {
            // keep the mallet a little ahead of your finger so you can see it
            const tx = I.ptr.x, ty = I.ptr.y + (G.face ? (p === 0 ? -70 : 70) : 0);
            const dx = tx - m.x, dy = ty - m.y, L = len(dx, dy), mx = 5200 * h;
            if (L > mx) { m.x += dx / L * mx; m.y += dy / L * mx; } else { m.x = tx; m.y = ty; }
          } else {
            const v = G.dir(p);
            m.x += v.x * 1500 * h; m.y += v.y * 1500 * h;
          }
          m.x = G.clamp(m.x, MR, 1000 - MR);
          m.y = p === 0 ? G.clamp(m.y, 800 + MR * 0.6, 1600 - MR) : G.clamp(m.y, MR, 800 - MR * 0.6);
          m.vx = (m.x - ox) / h; m.vy = (m.y - oy) / h;
        }
        const k = d.puck;
        k.x += k.vx * h; k.y += k.vy * h;
        const f = Math.exp(-0.32 * h); k.vx *= f; k.vy *= f;
        if (k.x < PR) { k.x = PR; k.vx = Math.abs(k.vx) * 0.92; G.snd('wall'); }
        if (k.x > 1000 - PR) { k.x = 1000 - PR; k.vx = -Math.abs(k.vx) * 0.92; G.snd('wall'); }
        const inMouth = Math.abs(k.x - 500) < GOAL / 2 - PR * 0.4;
        if (!inMouth) {
          if (k.y < PR) { k.y = PR; k.vy = Math.abs(k.vy) * 0.92; G.snd('wall'); }
          if (k.y > 1600 - PR) { k.y = 1600 - PR; k.vy = -Math.abs(k.vy) * 0.92; G.snd('wall'); }
        }
        if (k.y < -PR) { d.conceded = 1; G.burst(k.x, 10, PL[0].c, 30, 700); G.shake(10); G.point(0, { msg: 'GOAL!', sub: 'Blue scores' }); return; }
        if (k.y > 1600 + PR) { d.conceded = 0; G.burst(k.x, 1590, PL[1].c, 30, 700); G.shake(10); G.point(1, { msg: 'GOAL!', sub: 'Red scores' }); return; }
        for (const p of [0, 1]) {
          const m = d.m[p], dx = k.x - m.x, dy = k.y - m.y, L = len(dx, dy);
          if (L < MR + PR && L > 0.01) {
            const nx = dx / L, ny = dy / L;
            k.x = m.x + nx * (MR + PR); k.y = m.y + ny * (MR + PR);
            const rvx = k.vx - m.vx, rvy = k.vy - m.vy, vn = rvx * nx + rvy * ny;
            if (vn < 0) {
              k.vx -= 1.9 * vn * nx; k.vy -= 1.9 * vn * ny;
              G.snd('hit');
              if (Math.abs(vn) > 600) G.burst(k.x - nx * PR, k.y - ny * PR, PL[p].c, 6, 300, 6);
            }
            const sp = len(k.vx, k.vy);
            if (sp > 3400) { k.vx *= 3400 / sp; k.vy *= 3400 / sp; }
          }
        }
      }
      d.trail.push([d.puck.x, d.puck.y]); if (d.trail.length > 10) d.trail.shift();
    },
    draw(G, g) {
      const d = G.d;
      G.bg('#0a1420', '#0a1420');
      G.halves(0.07);
      g.strokeStyle = 'rgba(160,220,255,.25)'; g.lineWidth = 6;
      g.beginPath(); g.moveTo(0, 800); g.lineTo(1000, 800); g.stroke();
      G.circle(500, 800, 150, null, 'rgba(160,220,255,.25)', 6);
      G.circle(500, 800, 14, 'rgba(160,220,255,.35)');
      for (const p of [0, 1]) {
        const y = p === 0 ? 1600 : 0;
        g.strokeStyle = 'rgba(160,220,255,.18)'; g.beginPath(); g.arc(500, y, 230, p === 0 ? Math.PI : 0, p === 0 ? Math.PI * 2 : Math.PI); g.stroke();
        G.glow(PL[p].glow, 30); g.fillStyle = PL[p].c; g.fillRect(500 - GOAL / 2, p === 0 ? 1588 : 0, GOAL, 12); G.noGlow();
      }
      g.strokeStyle = 'rgba(160,220,255,.5)'; g.lineWidth = 10; g.strokeRect(5, 5, 990, 1590);
      // puck trail and puck
      d.trail.forEach(([x, y], i) => { g.globalAlpha = i / d.trail.length * 0.25; G.circle(x, y, PR * (0.5 + i / 20), '#fff'); });
      g.globalAlpha = 1;
      G.glow('rgba(255,255,255,.8)', 26); G.circle(d.puck.x, d.puck.y, PR, '#f4f7ff'); G.noGlow();
      G.circle(d.puck.x, d.puck.y, PR * 0.62, null, '#9aa7c0', 6);
      for (const p of [0, 1]) {
        const m = d.m[p];
        G.glow(PL[p].glow, 36); G.circle(m.x, m.y, MR, PL[p].c); G.noGlow();
        G.circle(m.x, m.y, MR * 0.72, PL[p].c2);
        G.circle(m.x, m.y, MR * 0.38, PL[p].c, 'rgba(255,255,255,.5)', 5);
      }
    },
  });

  /* ================================= PING PONG ================================= */
  const PW = 250, PH = 32, BR = 22;
  Duel.reg({
    id: 'pong', base: '#0f0d1d', name: 'Ping Pong', icon: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="3" height="10" rx="1.5" fill="#ffe066"/><rect x="18" y="10" width="3" height="10" rx="1.5" fill="#ffe066"/><circle cx="12" cy="12" r="2.3" fill="#fff"/></svg>', color: '#ffe066', cat: 'action', target: 7,
    blurb: 'Classic paddle duel. The ball speeds up every hit.',
    how: { touch: 'Slide your finger left and right\nto move your paddle.', keys: ['A / D (or W / S) to move', 'Arrow keys to move'] },
    pause: 1.0, recount: false,
    init(G) { G.d.serveTo = Math.random() < 0.5 ? 0 : 1; },
    newRound(G) {
      const d = G.d;
      d.pad = [{ x: 500, v: 0, flash: 0 }, { x: 500, v: 0, flash: 0 }];
      d.ball = { x: 500, y: 800, vx: 0, vy: 0, sp: 820 };
      d.wait = 0.7; d.hits = 0; d.trail = [];
    },
    update(G, dt) {
      const d = G.d, b = d.ball;
      for (const p of [0, 1]) {
        const q = d.pad[p], I = G.inp[p], ox = q.x;
        if (I.ptr) { const dx = I.ptr.x - q.x, mx = 4200 * dt; q.x += Math.abs(dx) > mx ? Math.sign(dx) * mx : dx; }
        else q.x += G.dir(p).x * 1500 * dt;
        q.x = G.clamp(q.x, PW / 2, 1000 - PW / 2);
        q.v = (q.x - ox) / Math.max(dt, 1e-3);
        q.flash = Math.max(0, q.flash - dt * 3);
      }
      if (d.wait > 0) {
        d.wait -= dt;
        if (d.wait <= 0) {
          const a = G.rnd(-0.45, 0.45), dir = d.serveTo === 0 ? 1 : -1;
          b.vx = Math.sin(a) * b.sp; b.vy = Math.cos(a) * b.sp * dir;
        }
        return;
      }
      const N = 3, h = dt / N;
      for (let s = 0; s < N; s++) {
        const oy = b.y;
        b.x += b.vx * h; b.y += b.vy * h;
        if (b.x < BR) { b.x = BR; b.vx = Math.abs(b.vx); G.snd('wall'); }
        if (b.x > 1000 - BR) { b.x = 1000 - BR; b.vx = -Math.abs(b.vx); G.snd('wall'); }
        for (const p of [0, 1]) {
          const q = d.pad[p], py = p === 0 ? 1480 : 120, face = p === 0 ? py - PH / 2 - BR : py + PH / 2 + BR;
          const coming = p === 0 ? b.vy > 0 : b.vy < 0;
          const crossed = p === 0 ? oy <= face && b.y >= face : oy >= face && b.y <= face;
          if (coming && crossed && Math.abs(b.x - q.x) < PW / 2 + BR) {
            d.hits++;
            b.sp = Math.min(2300, b.sp * 1.06);
            const rel = G.clamp((b.x - q.x) / (PW / 2), -1, 1), ang = rel * 1.0;
            b.vx = Math.sin(ang) * b.sp + q.v * 0.18;
            b.vy = Math.cos(ang) * b.sp * (p === 0 ? -1 : 1);
            b.y = face;
            q.flash = 1; G.snd('hit');
            G.burst(b.x, b.y, PL[p].c, 8, 320, 6);
          }
        }
        if (b.y > 1640) { d.serveTo = 0; G.shake(8); G.point(1, { sub: d.hits > 8 ? `${d.hits}-hit rally!` : '' }); return; }
        if (b.y < -40) { d.serveTo = 1; G.shake(8); G.point(0, { sub: d.hits > 8 ? `${d.hits}-hit rally!` : '' }); return; }
      }
      d.trail.push([b.x, b.y]); if (d.trail.length > 12) d.trail.shift();
    },
    draw(G, g) {
      const d = G.d;
      G.bg('#0f0d1d', '#0f0d1d');
      G.halves(0.06);
      g.setLineDash([26, 22]); g.strokeStyle = 'rgba(255,255,255,.22)'; g.lineWidth = 6;
      g.beginPath(); g.moveTo(0, 800); g.lineTo(1000, 800); g.stroke(); g.setLineDash([]);
      d.trail.forEach(([x, y], i) => { g.globalAlpha = i / d.trail.length * 0.35; G.circle(x, y, BR * (0.4 + i / 24), '#ffe066'); });
      g.globalAlpha = 1;
      G.glow('rgba(255,224,102,.9)', 30); G.circle(d.ball.x, d.ball.y, BR, '#fff3b0'); G.noGlow();
      for (const p of [0, 1]) {
        const q = d.pad[p], py = p === 0 ? 1480 : 120;
        G.glow(PL[p].glow, 30 + q.flash * 30);
        g.fillStyle = q.flash > 0.3 ? '#fff' : PL[p].c;
        G.rr(q.x - PW / 2, py - PH / 2, PW, PH, 16); g.fill(); G.noGlow();
      }
      if (d.wait > 0) G.say(-1, 'Serving to ' + PL[d.serveTo].name, 500, 800, 44, PL[d.serveTo].c, { a: 0.8, dy: 70 });
    },
  });

  /* =================================== SUMO =================================== */
  const RING = 440, SR = 82;
  Duel.reg({
    id: 'sumo', base: '#1a0f0a', name: 'Sumo Push', icon: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="#ff9f43" stroke-width="1.8"/><circle cx="9" cy="12" r="3.2" fill="#3ea6ff"/><circle cx="15" cy="12" r="3.2" fill="#ff4d5e"/></svg>', color: '#ff9f43', cat: 'action', target: 5,
    blurb: 'Your wrestler spins. Tap to charge and shove the other one out of the ring.',
    how: { touch: 'Your wrestler keeps turning.\nTap to charge the way it faces.', keys: ['Space (or any Blue key) to charge', 'Enter (or any Red key) to charge'] },
    pause: 1.4,
    newRound(G) {
      G.d.s = [
        { x: 500, y: 1060, vx: 0, vy: 0, a: -Math.PI / 2, cd: 0, out: false, spin: 1 },
        { x: 500, y: 540, vx: 0, vy: 0, a: Math.PI / 2, cd: 0, out: false, spin: 1 },
      ];
      G.d.over = 0;
    },
    press(G, p) {
      const s = G.d.s[p];
      if (s.cd > 0 || s.out) return;
      s.vx += Math.cos(s.a) * 1150; s.vy += Math.sin(s.a) * 1150;
      s.cd = 0.3; s.dash = 0.25;
      G.snd('hit');
      G.burst(s.x - Math.cos(s.a) * SR, s.y - Math.sin(s.a) * SR, '#e8c58a', 8, 260, 8);
    },
    update(G, dt) {
      const d = G.d, [a, b] = d.s;
      for (const s of d.s) {
        if (!s.out) s.a += s.spin * 2.9 * dt;
        s.cd = Math.max(0, s.cd - dt); s.dash = Math.max(0, (s.dash || 0) - dt);
        s.x += s.vx * dt; s.y += s.vy * dt;
        const f = Math.exp(-2.3 * dt); s.vx *= f; s.vy *= f;
      }
      const dx = b.x - a.x, dy = b.y - a.y, L = len(dx, dy);
      if (L < SR * 2 && L > 0.01) {
        const nx = dx / L, ny = dy / L, push = (SR * 2 - L) / 2;
        a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push;
        const va = a.vx * nx + a.vy * ny, vb = b.vx * nx + b.vy * ny;
        if (va - vb > 0) {
          // swap the head-on speeds, with a little extra bounce
          const e = 1.15;
          a.vx += (vb - va) * nx * e; a.vy += (vb - va) * ny * e;
          b.vx += (va - vb) * nx * e; b.vy += (va - vb) * ny * e;
          G.snd('hit'); G.shake(Math.min(14, Math.abs(va - vb) / 90));
          G.burst((a.x + b.x) / 2, (a.y + b.y) / 2, '#fff', 10, 380, 7);
        }
      }
      for (const [p, s] of d.s.entries()) {
        if (!s.out && len(s.x - 500, s.y - 800) > RING) { s.out = true; G.burst(s.x, s.y, PL[p].c, 24, 500); }
      }
      if (a.out || b.out) {
        d.over += dt;
        if (d.over > 0.25) {
          if (a.out && b.out) G.point(-1, { msg: 'Both out!', sound: 'bad' });
          else G.point(a.out ? 1 : 0, { msg: 'Out of the ring!', sub: `${PL[a.out ? 1 : 0].name} wins the bout` });
        }
      }
    },
    draw(G, g) {
      const d = G.d;
      G.bg('#2a1810', '#1a0f0a');
      G.halves(0.07);
      G.circle(500, 800, RING + 46, '#5a3a22');
      const gr = g.createRadialGradient(500, 800, 50, 500, 800, RING);
      gr.addColorStop(0, '#e9cf9c'); gr.addColorStop(1, '#c9a46a');
      G.circle(500, 800, RING, gr);
      G.circle(500, 800, RING, null, '#f3e2b8', 14);
      g.fillStyle = 'rgba(255,255,255,.7)'; g.fillRect(430, 920, 140, 12); g.fillRect(430, 668, 140, 12);
      for (const [p, s] of d.s.entries()) {
        const sc = s.out ? 0.8 : 1;
        g.globalAlpha = s.out ? 0.5 : 1;
        G.circle(s.x + 10, s.y + 14, SR * sc, 'rgba(0,0,0,.25)');
        G.glow(PL[p].glow, s.dash > 0 ? 40 : 14);
        G.circle(s.x, s.y, SR * sc, '#f2c9a0'); G.noGlow();
        G.circle(s.x, s.y, SR * 0.78 * sc, null, PL[p].c, 22);
        // facing arrow
        const ax = s.x + Math.cos(s.a) * (SR + 30), ay = s.y + Math.sin(s.a) * (SR + 30);
        g.save(); g.translate(ax, ay); g.rotate(s.a);
        g.fillStyle = s.cd > 0 ? 'rgba(255,255,255,.35)' : PL[p].c;
        g.beginPath(); g.moveTo(30, 0); g.lineTo(-14, -24); g.lineTo(-14, 24); g.closePath(); g.fill();
        g.restore();
        g.save(); g.translate(s.x, s.y); g.rotate(s.a + Math.PI / 2); g.font = `${60 * sc}px serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; G.sprite(s.out ? 'dizzy' : 'face', 64 * sc); g.restore();
        g.globalAlpha = 1;
      }
    },
  });
})();

/* Action games, part 2: Tank Duel, Light Cycles, Paint Wars, Asteroid Dodge */
(() => {
  const { PL } = Duel;
  const len = (x, y) => Math.hypot(x, y);

  /* ================================= TANK DUEL ================================= */
  const TR = 40;
  const LAYOUTS = [
    [[150, 430, 260, 40], [690, 260, 40, 240], [420, 760, 160, 40], [130, 760, 40, 200]],
    [[0, 560, 320, 40], [470, 380, 40, 260], [680, 620, 40, 180], [250, 760, 180, 40]],
    [[210, 470, 100, 100], [690, 470, 100, 100], [450, 750, 100, 100], [470, 200, 60, 160]],
    [[120, 330, 40, 300], [320, 520, 360, 40], [840, 300, 40, 240], [470, 700, 60, 60]],
  ];
  const mirror = r => [1000 - r[0] - r[2], 1600 - r[1] - r[3], r[2], r[3]];
  function circleRect(c, r, R) {
    const nx = Math.max(R[0], Math.min(c.x, R[0] + R[2])), ny = Math.max(R[1], Math.min(c.y, R[1] + R[3]));
    const dx = c.x - nx, dy = c.y - ny, L = len(dx, dy);
    if (L < r) {

/* Board games: Tic Tac Toe, Four in a Row, Dots and Boxes, Memory Match.
   These don't turn with the screen: on a tall screen Red's panel is at the top,
   on a wide screen Blue sits left and Red right. */
(() => {
  const { PL } = Duel;
  const world = portrait => (portrait ? { w: 1000, h: 1600 } : { w: 1600, h: 1000 });
  // where the board goes and where each player's panel goes
  function frame(G, aspect) {
    const P = G.portrait, a = aspect || 1;
    let bw = 920, bh = 920 / a;
    if (bh > 920) { bh = 920; bw = 920 * a; }
    const board = { x: (G.w - bw) / 2, y: (G.h - bh) / 2, w: bw, h: bh };
    const panel = P ? [{ x: 0, y: board.y + bh, w: G.w, h: G.h - board.y - bh }, { x: 0, y: 0, w: G.w, h: board.y }]
      : [{ x: 0, y: 0, w: board.x, h: G.h }, { x: board.x + bw, y: 0, w: G.w - board.x - bw, h: G.h }];
    return { board, panel };
  }
  function panels(G, F, turn, extra) {
    const g = G.g;
    for (const p of [0, 1]) {
      const r = F.panel[p], cx = r.x + r.w / 2, cy = r.y + r.h / 2, on = turn === p && G.state === 'play';
      if (on) { g.fillStyle = PL[p].soft; g.fillRect(r.x, r.y, r.w, r.h); }
      G.say(p, `${PL[p].name.toUpperCase()}  ${G.score[p]}`, cx, cy, 52, PL[p].c, { w: 900, dy: -36, glow: on ? PL[p].glow : null });
      G.say(p, on ? 'YOUR TURN' : (extra && extra[p]) || '', cx, cy, 36, on ? '#fff' : 'rgba(255,255,255,.55)', { w: 800, dy: 36 });
    }
  }
  // keyboard cursor helper
  function moveCursor(c, dirn, cols, rows) {
    if (dirn === 'l') c.x = (c.x + cols - 1) % cols;
    if (dirn === 'r') c.x = (c.x + 1) % cols;
    if (dirn === 'u') c.y = (c.y + rows - 1) % rows;
    if (dirn === 'd') c.y = (c.y + 1) % rows;
  }
  const keysHow = ['W A S D to move, Space to place', 'Arrows to move, Enter to place'];

  /* ================================ TIC TAC TOE ================================ */
  const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
  Duel.reg({
    id: 'ttt', base: '#0b1020', name: 'Tic Tac Toe', icon: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l7 7m0-7l-7 7" stroke="#3ea6ff" stroke-width="2.4" stroke-linecap="round"/><circle cx="16.5" cy="16.5" r="4" fill="none" stroke="#ff4d5e" stroke-width="2.4"/></svg>', color: '#3ea6ff', cat: 'board', target: 3, rotate: false, hud: false, world,
    blurb: 'Three in a row. First to win 3 games. Who goes first switches every game.',
    how: { touch: 'Take turns tapping a square.\nGet three in a row.', keys: keysHow },
    pause: 1.8, recount: false,
    newRound(G) { const d = G.d; d.b = Array(9).fill(-1); d.turn = G.round % 2; d.win = null; d.cur = { x: 1, y: 1 }; d.anim = []; },
    tap(G, x, y) {

      const cx = Math.floor((x - B.x) / (B.w / 3)), cy = Math.floor((y - B.y) / (B.h / 3));

    },
    key(G, p, k) {

    update(G, dt) { for (const a of G.d.anim) a.t = Math.min(1, a.t + dt * 5); },
    draw(G, g) {

        else { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.stroke(); }
        G.noGlow();

        G.glow('#fff', 30); g.strokeStyle = '#fff'; g.lineWidth = 16; g.beginPath(); g.moveTo(ax, ay); g.lineTo(cx, cy); g.stroke(); G.noGlow();
      }
      if (G.state === 'play' && G.inp[d.turn].usedKeys) { g.strokeStyle = PL[d.turn].c; g.lineWidth = 6; G.rr(B.x + d.cur.x * s + 14, B.y + d.cur.y * s + 14, s - 28, s - 28, 20); g.stroke(); }
      g.lineCap = 'butt';
    },
  });
  function place(G, i) {
    const d = G.d;
    if (G.state !== 'play' || d.win || d.b[i] !== -1) return;
    d.b[i] = d.turn; d.anim.push({ i, t: 0 }); G.snd('pick');
    const line = LINES.find(L => L.every(k => d.b[k] === d.turn));
    if (line) { d.win = { line }; G.point(d.turn, { msg: `${PL[d.turn].name} wins the game!` }); return; }
    if (d.b.every(v => v >= 0)) { G.point(-1, { msg: "It's a draw!", sound: 'tick' }); return; }
    d.turn = 1 - d.turn;
  }

  /* ================================ FOUR IN A ROW ================================ */
  const C4W = 7, C4H = 6;
  Duel.reg({
    id: 'connect4', base: '#0d0f1f', name: 'Four in a Row', icon: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3.5" fill="#ffd54a"/><circle cx="16" cy="8" r="3.5" fill="#ff4d5e"/><circle cx="8" cy="16" r="3.5" fill="#ff4d5e"/><circle cx="16" cy="16" r="3.5" fill="#ffd54a"/></svg>', color: '#ffd54a', cat: 'board', target: 2, rotate: false, hud: false, world,
    blurb: 'Drop discs and line up four in any direction. First to win 2 games.',
    how: { touch: 'Take turns tapping a column\nto drop your disc.', keys: ['A / D to pick a column, Space to drop', '← / → to pick a column, Enter to drop'] },
    pause: 2, recount: false,
    newRound(G) { const d = G.d; d.b = Array(C4W * C4H).fill(-1); d.turn = G.round % 2; d.win = null; d.col = 3; d.drop = null; },
    tap(G, x, y) { const F = frame(G, C4W / C4H), B = F.board, c = Math.floor((x - B.x) / (B.w / C4W)); if (c >= 0 && c < C4W && x >= B.x && x <= B.x + B.w) drop(G, c); return 'eat'; },
    key(G, p, k) { const d = G.d; if (p !== d.turn) return; if (k === 'l') d.col = (d.col + C4W - 1) % C4W; else if (k === 'r') d.col = (d.col + 1) % C4W; else if (k === 'ok' || k === 'd') drop(G, d.col); },
    update(G, dt) {
      const d = G.d;
      if (d.drop) {
        d.drop.v += 60 * dt; d.drop.y += d.drop.v * dt;
        if (d.drop.y >= d.drop.ty) { d.drop = null; G.snd('hit'); afterDrop(G); }
      }
    },
    draw(G, g) {
      const d = G.d, F = frame(G, C4W / C4H), B = F.board, s = B.w / C4W;
      G.bg('#0d0f1f', '#0d0f1f');
      panels(G, F, d.drop ? -1 : d.turn);
      g.fillStyle = '#1f3fbf'; G.rr(B.x - 14, B.y - 14, B.w + 28, B.h + 28, 30); g.fill();
      for (let r = 0; r < C4H; r++) for (let c = 0; c < C4W; c++) {
        const v = d.b[r * C4W + c], x = B.x + (c + 0.5) * s, y = B.y + (r + 0.5) * s;
        const hide = d.drop && d.drop.i === r * C4W + c;
        G.circle(x, y, s * 0.4, v < 0 || hide ? '#0d0f1f' : PL[v].c);
        if (v >= 0 && !hide) G.circle(x, y, s * 0.28, null, 'rgba(255,255,255,.25)', 6);
      }
      if (d.drop) { const x = B.x + (d.drop.c + 0.5) * s, y = B.y + (d.drop.y + 0.5) * s; G.circle(x, y, s * 0.4, PL[d.drop.p].c); }
      if (d.win) for (const i of d.win) { G.glow('#fff', 30); G.circle(B.x + (i % C4W + 0.5) * s, B.y + (Math.floor(i / C4W) + 0.5) * s, s * 0.16, '#fff'); G.noGlow(); }
      if (G.state === 'play' && !d.drop && G.inp[d.turn].usedKeys) {
        g.fillStyle = PL[d.turn].c; g.globalAlpha = 0.25; g.fillRect(B.x + d.col * s, B.y, s, B.h); g.globalAlpha = 1;
      }
    },
  });
  function drop(G, c) {
    const d = G.d;
    if (G.state !== 'play' || d.win || d.drop) return;
    let r = -1;
    for (let k = C4H - 1; k >= 0; k--) if (d.b[k * C4W + c] < 0) { r = k; break; }
    if (r < 0) return;
    d.col = c;
    d.b[r * C4W + c] = d.turn;
    d.drop = { c, i: r * C4W + c, p: d.turn, y: -1, ty: r, v: 2 };
    G.snd('pick');
  }
  function afterDrop(G) {
    const d = G.d, p = d.turn;
    for (let r = 0; r < C4H; r++) for (let c = 0; c < C4W; c++) {
      for (const [dx, dy] of [[1, 0], [0, 1], [1, 1], [1, -1]]) {
        const cells = [];
        for (let k = 0; k < 4; k++) { const x = c + dx * k, y = r + dy * k; if (x < 0 || y < 0 || x >= C4W || y >= C4H || d.b[y * C4W + x] !== p) break; cells.push(y * C4W + x); }
        if (cells.length === 4) { d.win = cells; G.point(p, { msg: `${PL[p].name} connects four!` }); return; }
      }
    }
    if (d.b.every(v => v >= 0)) { G.point(-1, { msg: 'Board full: draw!', sound: 'tick' }); return; }
    d.turn = 1 - p;
  }

  /* =============================== DOTS AND BOXES =============================== */
  const N = 4;   // boxes per side
  Duel.reg({
    id: 'dots', base: '#0c1712', name: 'Dots & Boxes', icon: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v14" fill="none" stroke="#3ddc84" stroke-width="2.2" stroke-linecap="round"/><g fill="#fff"><circle cx="5" cy="5" r="1.7"/><circle cx="19" cy="5" r="1.7"/><circle cx="5" cy="19" r="1.7"/><circle cx="19" cy="19" r="1.7"/></g></svg>', color: '#3ddc84', cat: 'board', target: 2, rotate: false, hud: false, world,
    blurb: 'Draw lines between dots. Close a box to claim it and go again.',
    how: { touch: 'Tap between two dots to draw a line.\nFinish a box: it is yours and you go again.', keys: ['Tap or click a line (mouse)', 'Tap or click a line (mouse)'] },
    pause: 2.4, recount: false,
    newRound(G) { const d = G.d; d.h = Array((N + 1) * N).fill(-1); d.v = Array(N * (N + 1)).fill(-1); d.box = Array(N * N).fill(-1); d.turn = G.round % 2; d.last = null; },
    tap(G, x, y) {
      const d = G.d, F = frame(G), B = F.board, pad = 60, s = (B.w - pad * 2) / N, ox = B.x + pad, oy = B.y + pad;
      const gx = (x - ox) / s, gy = (y - oy) / s;
      let best = null, bd = 0.32;
      // horizontal line (r, c): from dot (r,c) to (r,c+1)
      const rr = Math.round(gy), cc = Math.floor(gx);
      if (rr >= 0 && rr <= N && cc >= 0 && cc < N) { const dd = Math.abs(gy - rr); if (dd < bd) { bd = dd; best = ['h', rr * N + cc]; } }
      const rv = Math.floor(gy), cv = Math.round(gx);
      if (rv >= 0 && rv < N && cv >= 0 && cv <= N) { const dd = Math.abs(gx - cv); if (dd < bd) { bd = dd; best = ['v', rv * (N + 1) + cv]; } }
      if (best) line(G, best[0], best[1]);
      return 'eat';
    },
    update() {},
    draw(G, g) {
      const d = G.d, F = frame(G), B = F.board, pad = 60, s = (B.w - pad * 2) / N, ox = B.x + pad, oy = B.y + pad;
      G.bg('#0c1712', '#0c1712');
      const count = [0, 1].map(p => d.box.filter(v => v === p).length);
      panels(G, F, d.turn, [`${count[0]} boxes`, `${count[1]} boxes`]);
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        const v = d.box[r * N + c];
        if (v >= 0) { g.fillStyle = PL[v].soft.replace('.18', '.5'); g.fillRect(ox + c * s + 6, oy + r * s + 6, s - 12, s - 12); G.say(v, v === 0 ? '@dotB' : '@dotR', ox + (c + 0.5) * s, oy + (r + 0.5) * s, s * 0.35, '#fff'); }
      }
      g.lineCap = 'round';
      for (let r = 0; r <= N; r++) for (let c = 0; c < N; c++) {
        const v = d.h[r * N + c];
        g.strokeStyle = v < 0 ? 'rgba(255,255,255,.08)' : PL[v].c; g.lineWidth = v < 0 ? 10 : 16;
        if (v >= 0) G.glow(PL[v].glow, d.last === 'h' + (r * N + c) ? 30 : 10);
        g.beginPath(); g.moveTo(ox + c * s + 18, oy + r * s); g.lineTo(ox + (c + 1) * s - 18, oy + r * s); g.stroke(); G.noGlow();
      }
      for (let r = 0; r < N; r++) for (let c = 0; c <= N; c++) {
        const v = d.v[r * (N + 1) + c];
        g.strokeStyle = v < 0 ? 'rgba(255,255,255,.08)' : PL[v].c; g.lineWidth = v < 0 ? 10 : 16;
        if (v >= 0) G.glow(PL[v].glow, d.last === 'v' + (r * (N + 1) + c) ? 30 : 10);
        g.beginPath(); g.moveTo(ox + c * s, oy + r * s + 18); g.lineTo(ox + c * s, oy + (r + 1) * s - 18); g.stroke(); G.noGlow();
      }
      g.lineCap = 'butt';
      for (let r = 0; r <= N; r++) for (let c = 0; c <= N; c++) G.circle(ox + c * s, oy + r * s, 14, '#e8fff0');
    },
  });
  function line(G, kind, i) {
    const d = G.d, arr = kind === 'h' ? d.h : d.v;
    if (G.state !== 'play' || arr[i] >= 0) return;
    arr[i] = d.turn; d.last = kind + i; G.snd('pick');
    let got = 0;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const b = r * N + c;
      if (d.box[b] >= 0) continue;
      if (d.h[r * N + c] >= 0 && d.h[(r + 1) * N + c] >= 0 && d.v[r * (N + 1) + c] >= 0 && d.v[r * (N + 1) + c + 1] >= 0) { d.box[b] = d.turn; got++; }
    }
    if (got) { G.snd('score'); G.floatText(G.w / 2, G.h / 2, `+${got} box${got > 1 ? 'es' : ''}`, PL[d.turn].c, d.turn); }
    if (d.box.every(v => v >= 0)) {
      const a = d.box.filter(v => v === 0).length, b = N * N - a;
      if (a === b) G.point(-1, { msg: 'Tie game!', sub: `${a} – ${b}`, sound: 'tick' });
      else G.point(a > b ? 0 : 1, { msg: `${PL[a > b ? 0 : 1].name} wins the board!`, sub: `${a} – ${b} boxes` });
      return;
    }
    if (!got) d.turn = 1 - d.turn;
  }

  /* ================================ MEMORY MATCH ================================ */
  const MW = 4, MH = 4, EMO = ['m0', 'm1', 'm2', 'm3', 'm4', 'm5', 'm6', 'm7', 'm8', 'm9', 'm10', 'm11', 'm12', 'm13'];
  Duel.reg({
    id: 'memory', base: '#140c20', name: 'Memory Match', icon: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="9" height="13" rx="2" fill="#b56bff" transform="rotate(-10 7.5 11.5)"/><rect x="11" y="5" width="9" height="13" rx="2" fill="#f4eefc"/><path d="M15.5 9l1.2 2.4 2.6.4-1.9 1.8.5 2.6-2.4-1.3-2.4 1.3.5-2.6-1.9-1.8 2.6-.4z" fill="#b56bff"/></svg>', color: '#b56bff', cat: 'board', target: 2, rotate: false, hud: false, world,
    blurb: 'Flip two cards a turn. Find a pair to keep it and go again.',
    how: { touch: 'Take turns flipping two cards.\nMatch a pair to score and go again.', keys: keysHow },
    pause: 2.4, recount: false,
    newRound(G) {
      const d = G.d, pick = EMO.slice().sort(() => Math.random() - 0.5).slice(0, MW * MH / 2);
      d.cards = pick.concat(pick).sort(() => Math.random() - 0.5).map(e => ({ e, up: false, got: -1, flip: 0 }));
      d.turn = G.round % 2; d.open = []; d.wait = 0; d.cur = { x: 0, y: 0 }; d.pairs = [0, 0];
    },
    tap(G, x, y) {
      const F = frame(G), B = F.board, c = Math.floor((x - B.x) / (B.w / MW)), r = Math.floor((y - B.y) / (B.h / MH));
      if (c >= 0 && c < MW && r >= 0 && r < MH) flip(G, r * MW + c);
      return 'eat';
    },
    key(G, p, k) { const d = G.d; if (p !== d.turn) return; if (k === 'ok') flip(G, d.cur.y * MW + d.cur.x); else moveCursor(d.cur, k, MW, MH); },
    update(G, dt) {
      const d = G.d;
      for (const c of d.cards) c.flip += ((c.up || c.got >= 0 ? 1 : 0) - c.flip) * Math.min(1, dt * 12);
      if (d.wait > 0) {
        d.wait -= dt;
        if (d.wait <= 0) { for (const i of d.open) d.cards[i].up = false; d.open = []; d.turn = 1 - d.turn; }
      }
    },
    draw(G, g) {
      const d = G.d, F = frame(G), B = F.board, sw = B.w / MW, sh = B.h / MH;
      G.bg('#140c20', '#140c20');
      panels(G, F, d.wait > 0 ? -1 : d.turn, [`${d.pairs[0]} pairs`, `${d.pairs[1]} pairs`]);
      d.cards.forEach((c, i) => {
        const x = B.x + (i % MW) * sw + 10, y = B.y + Math.floor(i / MW) * sh + 10, w = sw - 20, h = sh - 20;
        const f = c.flip, sx = Math.abs(Math.cos(f * Math.PI)) || 0.02, face = f > 0.5;
        g.save(); g.translate(x + w / 2, y + h / 2); g.scale(sx, 1);
        g.fillStyle = face ? (c.got >= 0 ? PL[c.got].soft.replace('.18', '.55') : '#f4eefc') : '#3b2a5c';
        G.rr(-w / 2, -h / 2, w, h, 22); g.fill();
        g.strokeStyle = face ? (c.got >= 0 ? PL[c.got].c : '#fff') : '#6c4fa3'; g.lineWidth = 5; g.stroke();
        if (face) { if (G.rot) g.rotate(-Math.PI / 2); G.sprite(c.e, Math.min(w, h) * 0.62); }
        else { g.fillStyle = 'rgba(255,255,255,.12)'; g.font = `900 ${Math.min(w, h) * 0.4}px sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('?', 0, 4); }
        g.restore();
      });
      if (G.state === 'play' && G.inp[d.turn].usedKeys) { g.strokeStyle = PL[d.turn].c; g.lineWidth = 8; G.rr(B.x + d.cur.x * sw + 4, B.y + d.cur.y * sh + 4, sw - 8, sh - 8, 24); g.stroke(); }
    },
  });
  function flip(G, i) {
    const d = G.d, c = d.cards[i];
    if (G.state !== 'play' || d.wait > 0 || c.up || c.got >= 0 || d.open.length >= 2) return;
    c.up = true; d.open.push(i); G.snd('tap');
    if (d.open.length === 2) {
      const [a, b] = d.open.map(k => d.cards[k]);
      if (a.e === b.e) {
        a.got = b.got = d.turn; a.up = b.up = false; d.open = []; d.pairs[d.turn]++;
        G.snd('score'); G.floatText(G.w / 2, G.h / 2, 'Pair!', PL[d.turn].c, d.turn);
        if (d.cards.every(k => k.got >= 0)) {
          const [x, y] = d.pairs;
          if (x === y) G.point(-1, { msg: 'Tie!', sub: `${x} – ${y} pairs`, sound: 'tick' });
          else G.point(x > y ? 0 : 1, { msg: `${PL[x > y ? 0 : 1].name} remembers best!`, sub: `${x} – ${y} pairs` });
        }
      } else d.wait = 1.0;
    }
  }
})();

</script>
<script>
/* Version tag: when this copy was built, in your own time zone, shown on the home screen
   and in the menu, so you can tell whether the newest push has reached you yet.
   build.py stamps 202611280406 (UTC, YYYYMMDDHHMM) and duels-version.json (the version file that
   sits next to the page on the site). Every couple of minutes it checks that file and
   offers a reload when a newer version is live. */
const BuildVer = (() => {
  const B = '202611280406', FILE = 'duels-version.json';
  const parse = b => { const m = /^(\d{4})(\d\d)(\d\d)(\d\d)(\d\d)$/.exec(String(b || '')); return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5])) : null; };
  const fmt = d => d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const mine = parse(B);
  let newer = null;
  const label = () => mine ? 'Version ' + fmt(mine) : 'Version: test build';
  const newHTML = () => newer ? ` · <button type="button" class="vnew" onclick="location.reload()">${fmt(newer)} is out: reload</button>` : '';
  function paint() {
    const el = document.getElementById('verTag');
    if (!el) return;
    el.title = 'Build ' + B;
    el.innerHTML = label() + newHTML();
    for (const m of document.querySelectorAll('.mver')) m.innerHTML = label() + newHTML();
  }
  function check() {
    if (!/^https?:$/.test(location.protocol) || !mine || !window.fetch || document.hidden) return;
    fetch(FILE + '?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(j => {
      const d = j && parse(j.v);
      if (d && d > mine && (!newer || d > newer)) { newer = d; paint(); }
    }).catch(() => { /* offline or a downloaded copy: just show the label */ });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', paint); else paint();
  setTimeout(check, 2500);
  setInterval(check, 120000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
  return { B, label, html: () => `<div class="mver" title="Build ${B}">${label()}${newHTML()}</div>` };
})();
window.BuildVer = BuildVer;

</script>
<script>Duel.start();</script>
